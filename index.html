<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cousins Glass Room</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #FF3B30; --success: #34C759; --bg: #000; --text: #fff; }
        body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        
        /* Glassmorphism Design */
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 2.5rem; border-radius: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); text-align: center; width: 340px; border: 1px solid rgba(255,255,255,0.1); }
        
        h2 { margin-top: 0; font-weight: 700; letter-spacing: -1px; }
        input { width: 85%; padding: 15px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; font-size: 16px; background: rgba(0,0,0,0.2); color: #fff; outline: none; }
        
        button { width: 100%; padding: 15px; border-radius: 15px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; }

        #roomLink { background: rgba(255, 255, 255, 0.05); padding: 12px; font-size: 11px; border-radius: 10px; word-break: break-all; margin: 20px 0; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.1); }
        
        .player-list { margin-top: 25px; text-align: left; }
        .player-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; font-size: 14px; }
        .host-badge { background: #FFD60A; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="glass-card">
    <div id="loginScreen">
        <h2>ioGame</h2>
        <p style="color: rgba(255,255,255,0.5); font-size: 14px;">Enter name to join the glass room.</p>
        <input type="text" id="userName" placeholder="Your Name..." maxlength="15">
        <button class="btn-primary" onclick="joinGame()">Enter Room</button>
    </div>

    <div id="lobbyScreen" class="hidden">
        <h2 id="lobbyTitle">Lobby</h2>
        <div id="hostControls" class="hidden">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6);">Share this link with cousins:</p>
            <div id="roomLink"></div>
            <button class="btn-success" onclick="startGame()">Start Game</button>
            <button class="btn-outline" onclick="endGame()">Close Room</button>
        </div>
        <div id="playerControls" class="hidden">
            <p style="color: rgba(255,255,255,0.6);">Waiting for host to start...</p>
        </div>
        <div class="player-list">
            <h4 style="margin-bottom: 10px;">Players Connected:</h4>
            <div id="playerList"></div>
        </div>
    </div>

    <div id="gameScreen" class="hidden">
        <h1>🎮</h1>
        <h2>Game Active!</h2>
        <button class="btn-outline" id="hostEndBtn" onclick="endGame()">End Game</button>
    </div>
</div>

<script>
    // --- CONNECTED TO YOUR PROJECT iogame-145c9 ---
    const firebaseConfig = {
        apiKey: "AIzaSyAVREmzFgrnE_1NP9Ke-YbtynlS1Ka-HNk",
        authDomain: "iogame-145c9.firebaseapp.com",
        databaseURL: "https://iogame-145c9-default-rtdb.firebaseio.com",
        projectId: "iogame-145c9",
        storageBucket: "iogame-145c9.firebasestorage.app",
        messagingSenderId: "1024963573565",
        appId: "1:1024963573565:web:907f671f3fad2c56443754",
        measurementId: "G-N1J57G3WS6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let roomId = new URLSearchParams(window.location.search).get('room');
    let isHost = false;
    let myKey = null;

    if (!roomId) {
        roomId = Math.random().toString(36).substring(7);
        window.history.pushState({}, '', `?room=${roomId}`);
        isHost = true;
    }

    function joinGame() {
        const name = document.getElementById('userName').value.trim();
        if (!name) return alert("Enter a name!");

        const playerRef = db.ref(`rooms/${roomId}/players`).push();
        myKey = playerRef.key;

        playerRef.set({
            name: name,
            isHost: isHost,
            joinedAt: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            if (isHost) db.ref(`rooms/${roomId}/status`).set('waiting');
            showLobby(name);
        });
    }

    function showLobby(name) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('lobbyScreen').classList.remove('hidden');

        if (isHost) {
            document.getElementById('hostControls').classList.remove('hidden');
            document.getElementById('roomLink').innerText = window.location.href;
            document.getElementById('lobbyTitle').innerText = "👑 Host Lobby";
        } else {
            document.getElementById('playerControls').classList.remove('hidden');
        }

        db.ref(`rooms/${roomId}/players`).orderByChild('joinedAt').on('value', (snap) => {
            const players = snap.val();
            const list = document.getElementById('playerList');
            list.innerHTML = "";
            let i = 1;
            for (let id in players) {
                list.innerHTML += `<div class="player-item">
                    <span><b>${i}.</b> ${players[id].name}</span>
                    ${players[id].isHost ? '<span class="host-badge">HOST</span>' : ''}
                </div>`;
                i++;
            }
        });

        db.ref(`rooms/${roomId}/status`).on('value', (snap) => {
            if (snap.val() === 'playing') {
                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                if(!isHost) document.getElementById('hostEndBtn').classList.add('hidden');
            } else if (snap.val() === 'ended') {
                alert("Room closed by host.");
                location.href = location.pathname;
            }
        });
    }

    function startGame() { db.ref(`rooms/${roomId}/status`).set('playing'); }
    function endGame() { db.ref(`rooms/${roomId}/status`).set('ended'); setTimeout(() => db.ref(`rooms/${roomId}`).remove(), 2000); }
</script>
</body>
</html>
