<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ioGame - Multiplayer</title>
    <style>
        :root {
            --primary: #FF3B30; --success: #34C759; --accent: #007AFF;
            --glass-bg: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.25);
            --text-main: #E5E5EA; 
            --text-muted: #AEAEB2;
            --text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.5);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.6); --glass-border: rgba(0, 0, 0, 0.1);
                --text-main: #2C2C2E; 
                --text-muted: #48484A;
                --text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9), 0 0 2px rgba(255, 255, 255, 0.5);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            color: var(--text-main); 
            text-shadow: var(--text-shadow);
            min-height: 100dvh;
            overflow-x: hidden; 
            overflow-y: auto;
            display: flex; justify-content: center;
            background: #000 url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed; background-size: cover;
            transition: background 0.5s ease;
        }

        .app-container { 
            width: 100%; max-width: 500px; 
            min-height: 100dvh;
            display: flex; flex-direction: column; padding: 20px; position: relative; z-index: 1; 
        }
        
        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border); border-radius: 32px; padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        h1 { font-size: 46px; font-weight: 800; letter-spacing: -2px; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 15px; font-weight: 500; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        
        input { 
            width: 100%; background: rgba(150, 150, 150, 0.15); border: 1.5px solid transparent; 
            padding: 18px; border-radius: 20px; color: #fff; outline: none; text-shadow: none;
            font-size: 16px; font-weight: 500; margin-bottom: 16px; transition: 0.3s ease; 
        }
        @media (prefers-color-scheme: light) { input { color: #000; } }
        
        input:focus { border-color: var(--accent); background: rgba(150, 150, 150, 0.25); transform: translateY(-2px); }
        
        button { 
            width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 700; font-size: 16px; 
            cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-transform: uppercase; letter-spacing: 0.8px; text-shadow: none;
        }
        button:active { transform: scale(0.94); }
        
        .btn-primary { background: var(--success); color: #fff; box-shadow: 0 8px 20px rgba(52, 199, 89, 0.3); }
        .btn-danger { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3); }
        .btn-accent { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3); }
        .btn-disabled { background: rgba(150, 150, 150, 0.3); color: rgba(255,255,255,0.5); cursor: not-allowed; box-shadow: none; }
        
        .link-display-container { display: flex; gap: 8px; margin-bottom: 20px; }
        .link-display-container input {
            margin-bottom: 0; padding: 12px 16px; font-size: 14px; color: var(--accent);
            background: rgba(150, 150, 150, 0.15); border: 1px solid var(--glass-border);
        }
        
        .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .p-badge { 
            background: rgba(150, 150, 150, 0.15); border: 1px solid var(--glass-border); border-radius: 18px; 
            padding: 14px; text-align: center; font-weight: 600; font-size: 15px; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .hidden { display: none !important; }
        .music-toggle { position: absolute; top: 20px; right: 20px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; z-index: 100; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="music-toggle" onclick="toggleMusic()" id="musicBtn">🎵</div>

<div class="app-container">
    <div id="view-login" style="margin-top: 15vh;">
        <h1>ioGame</h1>
        <div class="subtitle">Multiplayer Experience 🎮</div>
        <div class="glass-card">
            <input type="text" id="userName" placeholder="Enter your name" maxlength="12">
            <button class="btn-primary" onclick="joinGame()">Connect Online</button>
        </div>
    </div>

    <div id="view-lobby" class="hidden">
        <div class="glass-card" style="margin-bottom: 15px;">
            <p style="font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-align: center;">🔗 Multiplayer Invite Link</p>
            <div class="link-display-container">
                <input type="text" id="lobbyLinkInput" readonly value="">
                <button class="btn-accent" style="width: auto; padding: 0 20px;" onclick="copyInviteLink(this)">Copy</button>
            </div>
        </div>
        
        <div class="glass-card">
            <h2 id="lobbyStatusText" style="font-size: 18px; margin-bottom: 15px; text-align: center;">Players in Room</h2>
            <div class="player-grid" id="lobbyPlayers"></div>
            <button id="btnStartGame" class="btn-disabled" disabled>Wait for Host</button>
            <button class="btn-danger" style="margin-top: 12px;" onclick="leaveRoom()">Disconnect</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getDatabase, ref, onValue, set, onDisconnect, push } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    // Firebase configuration from your uploaded screenshots
    const firebaseConfig = {
        apiKey: "AIzaSyAVREmzFgrnE_1NP9Ke-YbtynlS1Ka-HNk",
        authDomain: "iogame-145c9.firebaseapp.com",
        databaseURL: "https://iogame-145c9-default-rtdb.firebaseio.com",
        projectId: "iogame-145c9",
        storageBucket: "iogame-145c9.firebasestorage.app",
        messagingSenderId: "1024963573565",
        appId: "1:1024963573565:web:907f671f3fad2c56443754",
        measurementId: "G-N1J57G3WS6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'iogame-main';

    let user = null;
    let roomId = null;
    let myName = "";

    // Auth Initialization
    onAuthStateChanged(auth, (u) => {
        user = u;
        if (!u) {
            signInAnonymously(auth).catch(console.error);
        }
    });

    // Check for room ID in URL
    const urlParams = new URLSearchParams(window.location.search);
    const urlRoom = urlParams.get('room');

    window.joinGame = async () => {
        myName = document.getElementById('userName').value.trim();
        if (!myName || !user) return;

        roomId = urlRoom || "global_room";
        
        // Use Realtime Database for presence (much more reliable for "left/swiped away")
        const presenceRef = ref(rtdb, `presence/${appId}/${roomId}/${user.uid}`);
        set(presenceRef, { name: myName, joinedAt: Date.now() });
        
        // CRITICAL: Immediately remove player if they leave/swipe away
        onDisconnect(presenceRef).remove();

        // Also track in Firestore for the game state
        const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId, 'players', user.uid);
        await setDoc(playerRef, {
            name: myName,
            uid: user.uid,
            isHost: !urlRoom,
            lastSeen: Date.now()
        });

        // If user closes tab, cleanup Firestore too
        window.addEventListener('beforeunload', () => {
            deleteDoc(playerRef);
        });

        document.getElementById('lobbyLinkInput').value = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
        switchView('view-lobby');
        listenToPlayers();
    };

    function listenToPlayers() {
        // Listen to RTDB presence for the most accurate "online" list
        const presenceListRef = ref(rtdb, `presence/${appId}/${roomId}`);
        onValue(presenceListRef, (snapshot) => {
            const players = snapshot.val() || {};
            renderPlayerGrid(players);
        });
    }

    function renderPlayerGrid(players) {
        const grid = document.getElementById('lobbyPlayers');
        grid.innerHTML = "";
        
        const playerKeys = Object.keys(players);
        playerKeys.forEach(uid => {
            const p = players[uid];
            const isMe = uid === user.uid;
            grid.innerHTML += `
                <div class="p-badge" id="badge-${uid}">
                    ${p.name} ${isMe ? '(You)' : ''}
                </div>
            `;
        });

        const btnStart = document.getElementById('btnStartGame');
        if (playerKeys.length >= 2) {
            btnStart.disabled = false;
            btnStart.classList.remove('btn-disabled');
            btnStart.classList.add('btn-primary');
            btnStart.innerText = "Start Game 🚀";
        } else {
            btnStart.disabled = true;
            btnStart.classList.add('btn-disabled');
            btnStart.innerText = "Waiting for players...";
        }
    }

    function switchView(viewId) {
        ['view-login', 'view-lobby'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
    }

    window.copyInviteLink = (btn) => {
        const input = document.getElementById('lobbyLinkInput');
        input.select();
        document.execCommand('copy');
        const oldText = btn.innerText;
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = oldText, 2000);
    };

    window.leaveRoom = () => {
        window.location.href = window.location.pathname;
    };

    window.toggleMusic = () => {
        const btn = document.getElementById('musicBtn');
        btn.innerText = btn.innerText === "🎵" ? "🔇" : "🎵";
    };

</script>
</body>
</html>
