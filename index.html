<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cousins Game Room</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f2f2f7; color: #1c1c1e; }
        .card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 2rem; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); text-align: center; width: 320px; border: 1px solid rgba(255,255,255,0.3); }
        h2 { margin-top: 0; font-weight: 600; }
        input { width: 80%; padding: 12px; margin: 10px 0; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 12px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-primary { background: #007AFF; color: white; }
        .btn-danger { background: #FF3B30; color: white; }
        .btn-success { background: #34C759; color: white; }
        #roomLink { background: #e5e5ea; padding: 10px; font-size: 12px; border-radius: 8px; word-break: break-all; margin: 15px 0; color: #8e8e93; }
        .player-item { padding: 10px; border-bottom: 1px solid #e5e5ea; text-align: left; display: flex; justify-content: space-between; }
        .hidden { display: none; }
        .host-badge { background: #FFD60A; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div id="loginScreen">
        <h2>Join Game</h2>
        <input type="text" id="userName" placeholder="Enter your name">
        <button class="btn-primary" onclick="joinGame()">Enter Room</button>
    </div>

    <div id="lobbyScreen" class="hidden">
        <h2 id="lobbyTitle">Lobby</h2>
        
        <div id="hostControls" class="hidden">
            <p style="font-size: 14px; color: #8e8e93;">Share this link with cousins:</p>
            <div id="roomLink"></div>
            <button class="btn-success" onclick="startGame()">Start Game</button>
            <button class="btn-danger" onclick="endGame()">End Game</button>
        </div>

        <div id="playerControls" class="hidden">
            <p>Waiting for the host to start...</p>
        </div>

        <div style="margin-top: 20px;">
            <h4 style="text-align: left; margin-bottom: 10px;">Players:</h4>
            <div id="playerList"></div>
        </div>
    </div>

    <div id="gameScreen" class="hidden">
        <h2>🎮 Game On!</h2>
        <p>The game has started. Good luck!</p>
        <button class="btn-danger" id="hostEndGame" class="hidden" onclick="endGame()">End Game for All</button>
    </div>
</div>

<script>
    // --- 1. PASTE YOUR REAL FIREBASE CONFIG HERE ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let roomId = new URLSearchParams(window.location.search).get('room');
    let isHost = false;

    // Auto-generate room if none exists
    if (!roomId) {
        roomId = Math.random().toString(36).substring(7);
        window.history.pushState({}, '', `?room=${roomId}`);
        isHost = true;
    }

    function joinGame() {
        const name = document.getElementById('userName').value;
        if (!name) return alert("Please enter your name!");

        const playersRef = db.ref(`rooms/${roomId}/players`);
        
        // Push player to list
        playersRef.push({
            name: name,
            isHost: isHost,
            joinedAt: firebase.database.ServerValue.TIMESTAMP
        });

        // Setup room if host
        if (isHost) {
            db.ref(`rooms/${roomId}/status`).set('waiting');
        }

        setupLobby(name);
    }

    function setupLobby(myName) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('lobbyScreen').classList.remove('hidden');

        if (isHost) {
            document.getElementById('hostControls').classList.remove('hidden');
            document.getElementById('roomLink').innerText = window.location.href;
            document.getElementById('lobbyTitle').innerText = "👑 Host Lobby";
        } else {
            document.getElementById('playerControls').classList.remove('hidden');
            document.getElementById('lobbyTitle').innerText = "Player Lobby";
        }

        // Real-time Player List (shows Player 1, Player 2, etc.)
        db.ref(`rooms/${roomId}/players`).on('value', (snapshot) => {
            const players = snapshot.val();
            const listDiv = document.getElementById('playerList');
            listDiv.innerHTML = "";
            
            let count = 1;
            for (let id in players) {
                const p = players[id];
                listDiv.innerHTML += `
                    <div class="player-item">
                        <span><b>${count}.</b> ${p.name}</span>
                        ${p.isHost ? '<span class="host-badge">HOST</span>' : ''}
                    </div>
                `;
                count++;
            }
        });

        // Watch for Game Start/End
        db.ref(`rooms/${roomId}/status`).on('value', (snapshot) => {
            const status = snapshot.val();
            if (status === 'playing') {
                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                if (isHost) document.getElementById('hostEndGame').classList.remove('hidden');
            } else if (status === 'ended') {
                alert("Game has been ended by the host.");
                location.reload(); // Refresh to start over
            }
        });
    }

    function startGame() {
        db.ref(`rooms/${roomId}/status`).set('playing');
    }

    function endGame() {
        db.ref(`rooms/${roomId}/status`).set('ended');
        // Delete room data after a short delay to clean up
        setTimeout(() => {
            db.ref(`rooms/${roomId}`).remove();
        }, 2000);
    }
</script>

</body>
</html>
