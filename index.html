<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ioGame</title>
    <style>
        :root {
            --primary: #FF3B30; --success: #34C759; --accent: #007AFF;
            --glass-bg: rgba(255, 255, 255, 0.22); --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #FFFFFF; --text-muted: #FFFFFF;
            --text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.5);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.6); --glass-border: rgba(0, 0, 0, 0.1);
                --text-main: #2C2C2E; --text-muted: #48484A;
                --text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9), 0 0 2px rgba(255, 255, 255, 0.5);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: var(--text-main); text-shadow: var(--text-shadow);
            height: 100dvh; overflow: hidden;
            display: flex; justify-content: center;
            background: #000 url('desk.png') no-repeat center center fixed; background-size: cover;
            transition: background 0.5s ease;
        }
        @media (orientation: portrait) { body { background-image: url('vert.png'); } }

        .app-container { 
            width: 100%; max-width: 1200px; height: 100%; 
            display: flex; flex-direction: column; padding: 15px; 
            position: relative; z-index: 1; margin: 0 auto;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        @media (min-width: 768px) { .app-container { padding: 30px; } }

        .view-centered { max-width: 500px; width: 100%; margin: 0 auto; }
        .view-centered-wide { max-width: 700px; width: 100%; margin: 0 auto; }

        .glass-card { 
            background: var(--glass-bg); backdrop-filter: blur(50px) saturate(150%); -webkit-backdrop-filter: blur(50px) saturate(150%);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @media (min-width: 768px) { .glass-card { border-radius: 32px; padding: 28px; } }

        h1 { font-size: 42px; font-weight: 800; letter-spacing: -2px; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 15px; font-weight: 500; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        @media (min-width: 768px) { h1 { font-size: 52px; } .subtitle { font-size: 18px; } }
        
        input, textarea { 
            width: 100%; background: rgba(255, 255, 255, 0.12); border: 1.5px solid transparent; 
            padding: 16px; border-radius: 16px; color: #fff; outline: none; text-shadow: none;
            font-size: 16px; font-weight: 500; margin-bottom: 12px; transition: 0.3s ease; 
            font-family: inherit;
        }
        @media (prefers-color-scheme: light) { 
            input, textarea { background: rgba(255, 255, 255, 0.5); color: #000; } 
        }
        input:focus, textarea:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.18); transform: translateY(-2px); }
        @media (prefers-color-scheme: light) { 
            input:focus, textarea:focus { background: rgba(255, 255, 255, 0.8); } 
        }
        
        input::placeholder, textarea::placeholder { color: #ffffff; opacity: 1; font-weight: 600; }
        @media (prefers-color-scheme: light) { input::placeholder, textarea::placeholder { color: rgba(0, 0, 0, 0.5); } }

        button { 
            width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 700; font-size: 16px; 
            cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.8px; text-shadow: none;
        }
        button:active { transform: scale(0.96); }
        .btn-primary { background: var(--success); color: #fff; box-shadow: 0 8px 20px rgba(52, 199, 89, 0.3); }
        .btn-danger { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3); }
        .btn-accent { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3); }
        .btn-disabled { background: var(--success); opacity: 0.65; color: rgba(255, 255, 255, 0.9); cursor: not-allowed; box-shadow: none; }

        .link-display-container { display: flex; gap: 8px; margin-bottom: 20px; }
        .link-display-container input { margin-bottom: 0; padding: 12px 16px; color: var(--accent); } 
        
        .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        @media (min-width: 768px) { .player-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .player-grid { grid-template-columns: repeat(4, 1fr); } }

        .p-badge { 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 14px; 
            padding: 12px; text-align: center; font-weight: 600; font-size: 14px; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        #view-game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        #view-game > .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 15px; min-height: 0; }
        @media (min-width: 768px) { #view-game > .game-wrapper { padding: 24px; } }

        .game-content-split {
            display: flex; flex-direction: column; flex: 1; gap: 12px; min-height: 0;
        }

        @media (min-width: 768px) and (orientation: landscape), (min-width: 1024px) {
            .game-content-split { flex-direction: row; gap: 20px; }
        }

        .board-section {
            flex: 1.2; position: relative; display: flex; align-items: center; justify-content: center;
            min-height: 320px; margin-top: 15px; flex-shrink: 0;
        }

        .chat-section {
            display: flex; flex-direction: column; flex: 1.5; min-height: 200px; flex-shrink: 0;
            background: rgba(0,0,0,0.25); backdrop-filter: blur(25px) saturate(120%); -webkit-backdrop-filter: blur(25px) saturate(120%);
            border-radius: 20px; border: 1px solid var(--glass-border);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        @media (min-width: 768px) and (orientation: landscape) { 
            .board-section { flex: 1; margin-top: 0; }
            .chat-section { width: 320px; height: 100%; flex: none; } 
        }
        @media (min-width: 1024px) { 
            .board-section { margin-top: 0; }
            .chat-section { width: 380px; height: 100%; flex: none; } 
        }

        .chat-scroll {
            flex: 1; padding: 15px; overflow-y: auto; scroll-behavior: smooth;
            display: flex; flex-direction: column; gap: 8px; min-height: 0;
            scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent;
        }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: var(--glass-border); border-radius: 10px; }

        .chat-msg { 
            padding: 8px 12px; font-size: 13px; width: fit-content; max-width: 90%; 
            animation: slideUp 0.3s ease; line-height: 1.3; backdrop-filter: blur(10px);
            border-radius: 16px; touch-action: pan-y; will-change: transform; transition: transform 0.2s;
            word-break: break-word;
        }
        @media (hover: hover) {
            .chat-msg:not(.chat-system):hover { transform: translateX(3px); cursor: grab; }
            .chat-msg:not(.chat-system):active { cursor: grabbing; }
        }
        
        .chat-reply-quote {
            background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent); padding: 4px 8px;
            border-radius: 4px; margin-bottom: 4px; font-size: 11px; color: var(--text-muted); text-shadow: none;
        }
        .chat-system { 
            margin: 4px auto; font-size: 11px; font-weight: 600; color: var(--text-muted); 
            background: transparent !important; border: none !important; font-style: italic; text-align: center;
        }

        .chat-input-area {
            padding: 12px; background: rgba(255, 255, 255, 0.05); border-top: 1px solid var(--glass-border);
        }
        .chat-input-area input, .chat-input-area textarea { margin-bottom: 0; padding: 12px; font-size: 14px; border-radius: 12px; }
        .chat-input-area textarea { height: 60px; min-height: 60px; max-height: 60px; resize: none; overflow-y: auto; line-height: 1.4; scrollbar-width: thin; }
        .chat-input-area button { padding: 12px 18px; font-size: 14px; border-radius: 12px; height: 60px; }

        #status-container { text-align: center; min-height: 40px; margin-bottom: 8px; flex-shrink: 0; }
        .fruit-btn {
            width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); border: 2px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: none; flex-shrink: 0;
        }
        @media (min-width: 768px) { .fruit-btn { width: 44px; height: 44px; font-size: 22px; } }
        .fruit-btn:active { transform: scale(0.9); }
        .fruit-btn.active-vote { 
            border-color: var(--success); background: rgba(52, 199, 89, 0.3); 
            box-shadow: 0 0 15px rgba(52, 199, 89, 0.5); transform: scale(1.1);
        }

        .player-node {
            position: absolute; width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: translate(-50%, -50%); z-index: 5; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: border-color 0.4s ease, box-shadow 0.4s ease, width 0.3s, height 0.3s;
        }
        @media (min-width: 768px) { .player-node { width: 80px; height: 80px; } }
        @media (min-width: 1024px) { .player-node { width: 100px; height: 100px; } }

        .score-badge {
            position: absolute; top: -6px; right: -6px; background: var(--accent); color: #fff; text-shadow: none;
            font-size: 11px; font-weight: bold; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 2px solid rgba(0,0,0,0.4); z-index: 6;
        }
        @media (min-width: 768px) { .score-badge { width: 30px; height: 30px; font-size: 14px; top: -5px; right: -5px; } }
        @media (min-width: 1024px) { .score-badge { width: 34px; height: 34px; font-size: 16px; top: -6px; right: -6px; } }
        
        .player-node.active-target-glow { border-color: var(--primary) !important; box-shadow: 0 0 20px 5px rgba(255, 59, 48, 0.6), inset 0 0 10px rgba(255, 59, 48, 0.4) !important; }
        .player-node.voted-glow { border-color: var(--success) !important; box-shadow: 0 0 20px 5px rgba(52, 199, 89, 0.6), inset 0 0 10px rgba(52, 199, 89, 0.4) !important; }

        .node-color { width: 14px; height: 14px; border-radius: 50%; margin-bottom: 2px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
        @media (min-width: 768px) { .node-color { width: 18px; height: 18px; margin-bottom: 4px; } }
        @media (min-width: 1024px) { .node-color { width: 22px; height: 22px; margin-bottom: 6px; } }
        
        .node-name {
            font-size: 11px; font-weight: 800; color: #fff; text-align: center; white-space: nowrap; overflow: hidden; 
            text-overflow: ellipsis; max-width: 90%; text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 2px #000;
        }
        @media (min-width: 768px) { .node-name { font-size: 14px; } }
        @media (min-width: 1024px) { .node-name { font-size: 16px; } }

        @keyframes countdownBlink { 0%, 100% { border-color: var(--glass-border); box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: translate(-50%, -50%) scale(1); } 50% { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 25px rgba(255,255,255,0.6); transform: translate(-50%, -50%) scale(1.05); } }
        .node-blink { animation: countdownBlink 1s ease-in-out infinite !important; }
        @keyframes votePopAnim { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } }

        .center-orb {
            position: relative; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--glass-border);
            z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 15px 35px rgba(0,0,0,0.2); overflow: hidden; 
            animation: popIn 0.5s ease; transition: width 0.3s, height 0.3s;
        }
        @media (min-width: 768px) { .center-orb { width: 200px; height: 200px; } }
        @media (min-width: 1024px) { .center-orb { width: 260px; height: 260px; } }

        .countdown-view { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; text-align: center; padding: 10px; }

        .hidden { display: none !important; }

        @keyframes confettiFall { 0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; } }
        .confetti { position: absolute; width: 12px; height: 12px; z-index: 9999; pointer-events: none; border-radius: 2px; animation: confettiFall linear forwards; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes popInNode { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .emoji-row {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            font-size: clamp(24px, 7vw, 32px); flex-wrap: nowrap; white-space: nowrap;
            margin-bottom: 10px; text-shadow: none; width: 100%; overflow: hidden;
        }

        .score-pill {
            background: rgba(0,0,0,0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 14px;
            padding: 8px 14px; font-size: 15px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<div class="app-container">
    <!-- VIEW: LOGIN -->
    <div id="view-login" class="view-centered" style="margin-top: 20vh;">
        <h1>ioGame</h1>
        <div class="subtitle">Family Game Night 🎲</div>
        <div class="glass-card">
            <input type="text" id="userName" placeholder="Enter Your Nickname" maxlength="12">
            <button class="btn-primary" onclick="joinGame()">Enter Lobby</button>
        </div>
    </div>

    <!-- VIEW: LOBBY -->
    <div id="view-lobby" class="view-centered-wide hidden" style="margin-top: 10vh;">
        <div class="glass-card" style="margin-bottom: 15px;">
            <p style="font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-align: center;">🔗 Invite Friends & Family</p>
            <div class="link-display-container">
                <input type="text" id="lobbyLinkInput" readonly value="">
                <button class="btn-accent" style="width: auto; padding: 0 20px; font-size: 14px;" onclick="copyInviteLink(this)">Copy</button>
            </div>
        </div>
        
        <div class="glass-card">
            <div id="lobbyEmojiDisplay" class="emoji-row" style="animation: float 3s infinite;"></div>
            <h2 id="lobbyStatusText" style="font-size: 18px; margin-bottom: 20px; text-align: center;">Waiting in Lobby...</h2>
            <div class="player-grid" id="lobbyPlayers"></div>
            
            <button id="btnStartGame" class="btn-disabled" onclick="hostStartGame()">Waiting for Host...</button>
            <button class="btn-danger" style="margin-top: 12px;" onclick="leaveRoom()">Leave Room</button>
        </div>
    </div>

    <!-- VIEW: IN-GAME -->
    <div id="view-game" class="hidden">
        <div class="game-wrapper">
            
            <div id="status-container">
                <div id="gameStatus" class="hidden" style="font-weight: 700; color: var(--accent); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">System Ready</div>
                
                <div id="voting-header" class="hidden" style="display:flex; flex-direction:row; align-items:center; justify-content:center; gap:12px;">
                    <div id="voting-fruits" style="display:flex; gap:6px; flex-wrap:nowrap; justify-content:center;"></div>
                    <button id="btnSubmitVote" class="btn-accent" style="padding: 10px 20px; font-size:14px; width:auto; border-radius: 14px; display:none; flex-shrink:0;" onclick="submitVote()">VOTE</button>
                </div>
                
                <div id="target-message" class="hidden" style="color:var(--primary); font-weight:bold; font-size:15px;">🎯 You are the Target! Answer their questions.</div>
            </div>
            
            <div id="top-scoreboard" class="hidden" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px;"></div>

            <div id="emojiVaultDisplay" class="emoji-row" style="opacity:0.9;"></div>

            <div id="game-content-split" class="game-content-split hidden">
                
                <div class="board-section" id="zone-circular-board">
                    <div id="player-nodes-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
                    
                    <div id="center-glass-orb" class="center-orb">
                        <div id="center-countdown" class="countdown-view hidden">
                            <p style="font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 2px; text-transform: uppercase;">Your Fruit</p>
                            <div id="bigEmoji" style="font-size: 55px; line-height: 1.1; text-shadow: 0 5px 15px rgba(0,0,0,0.3);">❓</div>
                            <div id="countdownDisplay" style="font-size: 18px; font-weight: 900; color: #66B2FF; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 15px rgba(0,122,255,0.8); margin-top:5px;">5...</div>
                        </div>

                        <div id="center-transition" class="countdown-view hidden">
                            <p style="font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 5px; text-transform: uppercase;">Next Turn</p>
                            <div id="transitionPlayerName" style="font-size: 26px; font-weight: 900; color: #66B2FF; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 15px rgba(0,122,255,0.8); text-transform: uppercase;">Player</div>
                        </div>

                        <div id="center-playing" class="countdown-view hidden">
                            <p style="font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 5px; text-transform: uppercase;">Current Target</p>
                            <div id="playingTargetName" style="font-size: 26px; font-weight: 900; color: #66B2FF; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 15px rgba(0,122,255,0.8); text-transform: uppercase;">Name</div>
                        </div>

                        <div id="center-results" class="countdown-view hidden">
                            <p style="font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 5px; text-transform: uppercase;">Target's Fruit</p>
                            <div id="revealedFruit" style="font-size: 55px; line-height: 1.1; text-shadow: 0 5px 15px rgba(0,0,0,0.3);">❓</div>
                            <div id="revealedText" style="font-size: 15px; font-weight: 900; color: var(--success); text-shadow: 0 2px 4px rgba(0,0,0,0.9); margin-top:5px;">Scores Updated!</div>
                        </div>
                    </div>
                </div>

                <div class="chat-section" id="chat-panel-container">
                    <div id="center-chat" class="chat-scroll"></div>
                    
                    <div class="chat-input-area">
                        <div id="reply-indicator" class="hidden" style="background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent); padding: 5px 10px; margin-bottom: 8px; border-radius: 6px; display:flex; justify-content:space-between; align-items:center; font-size: 11px; text-shadow: none;">
                            <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:85%;">
                                <b id="reply-user" style="color:var(--accent);"></b><br>
                                <span id="reply-text" style="color:#ffffff;"></span>
                            </div>
                            <button onclick="clearReply()" style="background:none; border:none; color:white; width:auto; padding:0; font-size:18px; text-shadow:none;">×</button>
                        </div>

                        <div style="display: flex; gap: 8px;">
                            <textarea id="chatInput" placeholder="Message..." autocomplete="off"></textarea>
                            <button class="btn-primary" style="width: auto;" onclick="sendChatMessage()">Send</button>
                        </div>
                    </div>
                </div>

            </div>

            <div id="zone-result" class="hidden" style="text-align: center; margin: auto 0; animation: popIn 0.5s ease; width:100%; max-width: 600px; margin: 0 auto;">
                <div id="resultEmoji" style="font-size: 70px; margin-bottom: 10px; animation: float 2s infinite;">🎉</div>
                <h2 id="resultText" style="margin-bottom: 20px; font-size: 24px; font-weight: 800; line-height: 1.2;"></h2>
                
                <div id="end-controls">
                    <button id="btnPlayAgain" class="btn-primary" onclick="hostStartGame()">Play Again</button>
                    <button class="btn-danger" style="margin-top: 12px;" onclick="leaveRoom()">Leave Room</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FIREBASE MULTIPLAYER LOGIC -->

    window.joinGame = function() {
        let rawName = document.getElementById('userName').value.trim(); 
        if(!rawName) return;
        
        myName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
        playSfx(sfx.pop); if(!musicPlaying) toggleMusic();
        
        // Generate User ID
        myKey = 'user_' + Math.random().toString(36).substr(2, 9);
        
        // Construct shareable URL safely for display
        let displayUrl = window.location.href;
        try {
            const url = new URL(window.location.href);
            url.searchParams.set('room', roomId);
            displayUrl = url.href;
            if (displayUrl.startsWith('blob:')) throw new Error('blob environment'); // Trigger catch for blob environments
        } catch(e) {
            displayUrl = `https://play-iogame.com/?room=${roomId}`; // Fallback fake URL so UI stays clean in sandbox
        }
        document.getElementById('lobbyLinkInput').value = displayUrl;
        
        const playerRef = ref(db, `rooms/${roomId}/players/${myKey}`);
        
        // Setup OnDisconnect to strictly remove the player node immediately when leaving
        onDisconnect(playerRef).remove().then(() => {
            set(playerRef, { name: myName, joinedAt: Date.now() });
        });

        // Listen for Realtime Players Sync
        onValue(ref(db, `rooms/${roomId}/players`), (snap) => {
            globalPlayers = snap.val() || {};
            const pKeys = Object.keys(globalPlayers);
            
            if (pKeys.length > 0) {
                const oldestKey = pKeys.sort((a,b) => globalPlayers[a].joinedAt - globalPlayers[b].joinedAt)[0];
                amIHost = (oldestKey === myKey);
            }
            
            renderLobby();
            if(gameState.phase !== 'login' && gameState.phase !== 'lobby') {
                renderBoardNodes(false); // Update nodes immediately dynamically mapping to current players
            }
            
            // Recheck votes if a player drops during active turn
            if (gameState.phase === 'playing' && amIHost) {
                checkTurnResolution();
            }
        });

        // Listen for Realtime State Sync
        onValue(ref(db, `rooms/${roomId}/state`), (snap) => {
            const s = snap.val();
            if (s) {
                gameState = { 
                    phase: s.phase || 'login', 
                    countdown: s.countdown || 0,
                    playerItems: s.playerItems || {},
                    votes: s.votes || {}, 
                    scores: s.scores || {}, 
                    turnOrder: s.turnOrder || [],
                    turnIndex: s.turnIndex || 0,
                    nextTargetName: s.nextTargetName || '',
                    lastTargetFruit: s.lastTargetFruit || ''
                };
                handleGameState(gameState);
                
                // Host automatically checks for turn completion when state updates
                if (amIHost && gameState.phase === 'playing') {
                    checkTurnResolution();

    window.hostStartGame = function() {
        if (!amIHost) return;

        let shuffledItems = [...items].sort(() => 0.5 - Math.random());
        let playerItems = {}, initScores = {};

            playerItems: playerItems, 
            countdown: 5, 
            votes: null,

            turnIndex: 0

        let timer = 5;

            timer--;
            if (timer > 0) { 
                playSfx(sfx.tick); 
                updateState({ countdown: timer });

                clearInterval(interval); 
                playSfx(sfx.pop); 
                startTurn(); 
            }

    function checkTurnResolution() {
        if (!amIHost || gameState.phase !== 'playing') return;
        
        const s = gameState;
        const currentPlayers = Object.keys(globalPlayers);
        const activeVotes = Object.keys(s.votes || {}).filter(k => currentPlayers.includes(k));
        const targetId = s.turnOrder[s.turnIndex];
        const requiredVotes = currentPlayers.length - (currentPlayers.includes(targetId) ? 1 : 0);
        
        if (activeVotes.length >= requiredVotes && requiredVotes > 0) {
            const targetFruit = s.playerItems[targetId] ? s.playerItems[targetId].e : '❓';

            gameState.phase = 'readingResults'; // local prevention of double triggers
            updateState({ phase: 'readingResults', lastTargetFruit: targetFruit });
            
            let correct = [];
            let newScores = s.scores || {};
            
            for(let [pid, vote] of Object.entries(s.votes || {})) {
                if(vote === targetFruit) { 
                    newScores[pid] = (newScores[pid] || 0) + 10; 
                    if (globalPlayers[pid]) correct.push(globalPlayers[pid].name); 
                }
            }
            
            const targetName = globalPlayers[targetId] ? globalPlayers[targetId].name : 'Disconnected User';
            sendSystemMessage(`Target ${targetName} had ${targetFruit}! ` + (correct.length > 0 ? `${correct.join(', ')} guessed correctly (+10)!` : `Nobody guessed correctly (0 pts)!`));
            
            updateState({ scores: newScores });
            playSfx(sfx.alert);
            
            setTimeout(() => {
                let nextIndex = s.turnIndex + 1;
                
                // Skip any target who disconnected entirely during the game
                while (nextIndex < s.turnOrder.length && !globalPlayers[s.turnOrder[nextIndex]]) {
                    nextIndex++;
                }

                if (nextIndex >= s.turnOrder.length) {
                    updateState({ phase: 'finished' });
                } else {
                    // Skip the transition phase entirely and jump straight into the next turn
                    updateState({ turnIndex: nextIndex }).then(() => {
                        startTurn();
                    });
                }
            }, 4000);
        }
    }

    // Bug Fix: Dynamic node syncing specifically prevents UI rendering glitches with missing/ghost player cards
    function renderBoardNodes(isNewPhase = false) {
        const board = document.getElementById('zone-circular-board');
        if(!board || board.offsetParent === null) return; 
        
        const nodesContainer = document.getElementById('player-nodes-container');
        const keys = Object.keys(globalPlayers);
        const N = keys.length;
        if (N === 0) return;

        const angleStep = (Math.PI * 2) / N;
        const startAngle = (N === 2) ? Math.PI : -Math.PI / 2; 

        const minDimension = Math.min(board.clientWidth, board.clientHeight);
        const orbRadius = window.innerWidth >= 1024 ? 130 : (window.innerWidth >= 768 ? 100 : 75);
        const nodeRadiusOffset = window.innerWidth >= 1024 ? 65 : (window.innerWidth >= 768 ? 55 : 42);
        const radius = Math.max(orbRadius + nodeRadiusOffset, (minDimension / 2) - nodeRadiusOffset - 10);

        // Strict cleanup strictly enforces UI mapping with Database state
        Array.from(nodesContainer.children).forEach(child => {
            const id = child.id.replace('node-', '');
            if (!keys.includes(id)) child.remove();
        });

        keys.forEach((pid, index) => {
            const angle = startAngle + (index * angleStep);
            const pData = globalPlayers[pid];
            const pColor = getUserColorByName(pData.name);
            
            const currentTurnId = (gameState.turnOrder && gameState.turnOrder.length > gameState.turnIndex) ? gameState.turnOrder[gameState.turnIndex] : null;
            const isActiveTarget = pid === currentTurnId && gameState.phase !== 'countdown' && gameState.phase !== 'turnTransition' && gameState.phase !== 'readingResults';
            const hasVoted = gameState.votes && gameState.votes[pid];
            
            let glowClass = isActiveTarget ? 'active-target-glow' : (hasVoted ? 'voted-glow' : '');
            let nodeEl = document.getElementById(`node-${pid}`);
            
            // Re-create node entirely dynamically if missing
            if (!nodeEl) { 
                nodeEl = document.createElement('div'); 
                nodeEl.id = `node-${pid}`; 
                nodesContainer.appendChild(nodeEl); 
                nodeEl.style.animation = 'popInNode 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; 
            }

            if (hasVoted && !nodeEl.classList.contains('voted-glow')) {
                nodeEl.style.animation = 'none'; void nodeEl.offsetWidth; nodeEl.style.animation = 'votePopAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; playSfx(sfx.vote); 
            }

            nodeEl.className = `player-node ${glowClass} ${gameState.phase === 'countdown' ? 'node-blink' : ''}`;
            nodeEl.style.left = `calc(50% + ${Math.cos(angle) * radius}px)`; 
            nodeEl.style.top = `calc(50% + ${Math.sin(angle) * radius}px)`;
            nodeEl.style.borderColor = glowClass ? '' : 'var(--glass-border)';
            nodeEl.innerHTML = `<div class="score-badge">${gameState.scores[pid] || 0}</div><div class="node-color" style="background: ${pColor};"></div><div class="node-name">${pData.name}</div>`;
        });
        
        renderTopScoreboard();
    }

    function renderTopScoreboard() {
        const container = document.getElementById('top-scoreboard');
        if(!container) return;
        const keys = Object.keys(globalPlayers);
        if(keys.length === 0) return;
        
        const sortedKeys = keys.sort((a,b) => (gameState.scores[b] || 0) - (gameState.scores[a] || 0));
        container.innerHTML = sortedKeys.map(pid => {
            const pData = globalPlayers[pid];
            const pColor = getUserColorByName(pData.name);
            const score = gameState.scores[pid] || 0;
            const votedFruit = (gameState.votes && gameState.votes[pid]) ? `<span style="font-size: 18px; margin-left: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">${gameState.votes[pid]}</span>` : '';
            return `<div class="score-pill"><div class="node-color" style="background: ${pColor}; width: 14px; height: 14px; margin-bottom: 0;"></div><span style="color: #fff; text-shadow:none; display: flex; align-items: center; font-size: 15px;">${pData.name}${votedFruit}</span><span style="color: var(--success); text-shadow:none; font-size: 16px; margin-left: 4px;">${score}</span></div>`;
        }).join('');
    }

    function setupSwipeToReply() {
        const chatBox = document.getElementById('center-chat'); let startX = 0, swipedElem = null;
        const handleStart = (e, isTouch) => { const el = e.target.closest('.chat-msg'); if(!el || el.classList.contains('chat-system')) return; startX = isTouch ? e.touches[0].clientX : e.clientX; swipedElem = el; swipedElem.style.transition = 'none'; };
        const handleMove = (e, isTouch) => { 
            if(!swipedElem) return; 
            const diffX = (isTouch ? e.touches[0].clientX : e.clientX) - startX; 
            const isOwn = swipedElem.getAttribute('data-u') === myName;
            if (isOwn && diffX < 0 && diffX > -80) swipedElem.style.transform = `translateX(${diffX}px)`; 
            else if (!isOwn && diffX > 0 && diffX < 80) swipedElem.style.transform = `translateX(${diffX}px)`; 
        };
        const handleEnd = (e, isTouch) => { 
            if(!swipedElem) return; 
            const diffX = (isTouch ? e.changedTouches[0].clientX : e.clientX) - startX; 
            const isOwn = swipedElem.getAttribute('data-u') === myName;
            swipedElem.style.transition = 'transform 0.2s ease'; swipedElem.style.transform = 'translateX(0)'; 
            if ((isOwn && diffX < -40) || (!isOwn && diffX > 40)) setReply(swipedElem.getAttribute('data-u'), swipedElem.getAttribute('data-m')); 
            swipedElem = null; 
        };

        chatBox.addEventListener('touchstart', e => handleStart(e, true), {passive: true}); chatBox.addEventListener('touchmove', e => handleMove(e, true), {passive: true}); chatBox.addEventListener('touchend', e => handleEnd(e, true));
        chatBox.addEventListener('mousedown', e => handleStart(e, false)); window.addEventListener('mousemove', e => handleMove(e, false)); window.addEventListener('mouseup', e => handleEnd(e, false));
    }

    function setReply(user, msgText) {
        playSfx(sfx.pop); activeReply = { u: user, m: msgText };
        document.getElementById('reply-user').innerText = `Replying to ${user}`; document.getElementById('reply-text').innerText = msgText;
        document.getElementById('reply-indicator').classList.remove('hidden'); document.getElementById('chatInput').focus();
    }
    
    window.clearReply = function() { playSfx(sfx.pop); activeReply = null; document.getElementById('reply-indicator').classList.add('hidden'); }

    window.sendChatMessage = function() {
        const input = document.getElementById('chatInput'); if(!input.value.trim()) return; playSfx(sfx.send); 
        const payload = { u: myName, m: input.value.trim() }; if(activeReply) { payload.replyTo = activeReply; clearReply(); }
        push(ref(db, `rooms/${roomId}/chat`), payload);
        input.value = "";
    }
    
    document.getElementById("chatInput").addEventListener("keypress", function(e) { if (e.key === "Enter") { e.preventDefault(); sendChatMessage(); } });
</script>
</body>
