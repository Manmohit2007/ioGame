<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ioGame | Pro Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #FF3B30;
            --success: #34C759;
            --accent: #007AFF;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-heavy: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000 url('desk.png') no-repeat center center fixed;
            background-size: cover; color: #fff; height: 100vh; overflow: hidden;
        }

        @media (max-width: 768px) {
            body { background-image: url('vert.png'); }
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
            z-index: 0; pointer-events: none;
        }

        .container { 
            position: relative; z-index: 1; width: 100%; max-width: 600px; 
            margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 20px;
        }

        /* Glassmorphism Components */
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 28px; padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4); margin-bottom: 15px;
        }

        .player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        
        .p-card {
            background: var(--glass); border-radius: 18px; padding: 12px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .p-card.active { border-color: var(--success); transform: scale(1.05); background: rgba(52, 199, 89, 0.1); }
        .p-card.blurred { filter: blur(8px); opacity: 0.5; }

        .p-avatar { font-size: 24px; margin-bottom: 5px; }
        .p-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }

        /* Game UI */
        h1 { font-weight: 800; letter-spacing: -2px; margin: 0 0 5px 0; text-align: center; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; margin-bottom: 10px; }

        .chat-container {
            flex-grow: 1; overflow-y: auto; padding: 10px;
            background: rgba(0,0,0,0.2); border-radius: 20px; margin-bottom: 15px;
        }
        .msg { margin-bottom: 10px; font-size: 13px; animation: fadeIn 0.3s ease; }
        .msg b { color: var(--accent); margin-right: 5px; }

        input {
            width: 100%; background: var(--glass-heavy); border: none; padding: 15px;
            border-radius: 15px; color: #fff; font-size: 16px; outline: none; margin-bottom: 10px;
        }

        button {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-green { background: var(--success); color: #fff; box-shadow: 0 4px 15px rgba(52,199,89,0.3); }
        .btn-green:active { transform: scale(0.96); }

        .hidden { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="container">
    <div id="loginScreen" style="text-align:center; margin-top:30%;">
        <h1>ioGame</h1>
        <p style="opacity:0.6; font-size:14px; margin-bottom:30px;">Professional Social Deduction</p>
        <div class="glass-panel">
            <input type="text" id="userName" placeholder="ENTER NICKNAME" maxlength="10">
            <button class="btn-green" onclick="joinGame()">Join Room</button>
        </div>
    </div>

    <div id="gameBoard" class="hidden">
        <div style="text-align:center;">
            <div class="badge" style="background:var(--accent); color:#fff;">LIVE SESSION</div>
            <h2 id="statusText" style="margin:0 0 15px 0; font-size:18px;">Waiting for players...</h2>
        </div>

        <div class="player-grid" id="pGrid"></div>

        <div class="glass-panel" id="actionCenter">
            <div id="emojiHints" style="display:flex; justify-content:space-around; font-size:20px; margin-bottom:15px; opacity:0.5;">
                🍎 🚗 👟 🍕 📱 ⌚
            </div>

            <div class="chat-container" id="chatArea"></div>

            <div id="inputGroup" class="hidden">
                <input type="text" id="mainInput" placeholder="TYPE HERE...">
                <button id="sendBtn" class="btn-green">SEND MESSAGE</button>
            </div>

            <button id="hostStartBtn" class="btn-green hidden" onclick="triggerStart()">START NEW ROUND</button>
        </div>
        
        <button onclick="copyInvite()" style="background:none; color:rgba(255,255,255,0.3); font-size:10px;">COPY INVITE LINK</button>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG (Verified) ---
    const firebaseConfig = {
        apiKey: "AIzaSyAVREmzFgrnE_1NP9Ke-YbtynlS1Ka-HNk",
        authDomain: "iogame-145c9.firebaseapp.com",
        databaseURL: "https://iogame-145c9-default-rtdb.firebaseio.com",
        projectId: "iogame-145c9",
        storageBucket: "iogame-145c9.firebasestorage.app",
        messagingSenderId: "1024963573565",
        appId: "1:1024963573565:web:907f671f3fad2c56443754",
        measurementId: "G-N1J57G3WS6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // --- AUDIO ENGINE ---
    const sfx = {
        click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
        win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
        alert: new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3')
    };
    function play(sound) { sound.currentTime = 0; sound.play().catch(()=>{}); }

    // --- GAME LOGIC ---
    let roomId = new URLSearchParams(window.location.search).get('room') || Math.random().toString(36).substring(7);
    if (!window.location.search.includes('room')) window.history.pushState({}, '', `?room=${roomId}`);
    
    let myKey, myName, amIHost = false;
    const itemVault = [{e:"🍎", n:"Apple"}, {e:"🚗", n:"Tesla"}, {e:"👟", n:"Nike"}, {e:"🍕", n:"Pizza"}, {e:"📱", n:"iPhone"}, {e:"⌚", n:"Rolex"}];

    function copyInvite() { navigator.clipboard.writeText(window.location.href); alert("Invite Link Copied!"); }

    function joinGame() {
        myName = document.getElementById('userName').value.trim().toUpperCase();
        if(!myName) return;
        play(sfx.click);
        const ref = db.ref(`rooms/${roomId}/players`).push();
        myKey = ref.key;
        ref.set({ name: myName, joinedAt: firebase.database.ServerValue.TIMESTAMP }).then(initLobby);
    }

    function initLobby() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('gameBoard').classList.remove('hidden');

        db.ref(`rooms/${roomId}/players`).on('value', snap => {
            const players = snap.val() || {};
            const keys = Object.keys(players);
            amIHost = (myKey === keys[0]);
            
            const grid = document.getElementById('pGrid');
            grid.innerHTML = "";
            keys.forEach((id, i) => {
                grid.innerHTML += `
                    <div id="c-${id}" class="p-card">
                        <div class="p-avatar">👤</div>
                        <div class="p-name">${players[id].name}</div>
                        <div style="font-size:8px; opacity:0.4">${id === keys[0] ? 'HOST' : 'PLAYER '+i}</div>
                    </div>`;
            });

            if(amIHost) document.getElementById('hostStartBtn').classList.remove('hidden');
        });

        db.ref(`rooms/${roomId}/state`).on('value', snap => {
            if(snap.val()) syncUI(snap.val());
        });
    }

    function triggerStart() {
        play(sfx.click);
        db.ref(`rooms/${roomId}/players`).once('value', snap => {
            const keys = Object.keys(snap.val());
            const subject = keys[Math.floor(Math.random() * keys.length)];
            const target = itemVault[Math.floor(Math.random() * itemVault.length)];
            db.ref(`rooms/${roomId}/state`).set({
                phase: 'prep',
                subject: subject,
                item: target,
                log: [{u: 'SYSTEM', m: 'NEW ROUND STARTED!'}]
            });
        });
    }

    function syncUI(state) {
        const isSubject = (myKey === state.subject);
        const status = document.getElementById('statusText');
        const inputGroup = document.getElementById('inputGroup');
        const sendBtn = document.getElementById('sendBtn');
        const chat = document.getElementById('chatArea');

        // Render Chat
        chat.innerHTML = "";
        (state.log || []).forEach(l => {
            chat.innerHTML += `<div class="msg"><b>${l.u}:</b> ${l.m}</div>`;
            chat.scrollTop = chat.scrollHeight;
        });

        // Update Cards
        document.querySelectorAll('.p-card').forEach(c => c.classList.remove('active', 'blurred'));
        document.getElementById(`c-${state.subject}`).classList.add('active');
        if(state.phase === 'interrogating' && isSubject) document.getElementById(`c-${myKey}`).classList.add('blurred');

        if(state.phase === 'prep') {
            document.getElementById('hostStartBtn').classList.add('hidden');
            if(isSubject) {
                status.innerHTML = `YOUR ITEM: <span style="color:var(--success)">${state.item.e} ${state.item.item}</span>`;
                inputGroup.classList.remove('hidden');
                sendBtn.innerText = "START INTERROGATION";
                sendBtn.onclick = () => {
                    db.ref(`rooms/${roomId}/state/phase`).set('interrogating');
                    play(sfx.alert);
                };
            } else {
                status.innerText = "WAITING FOR SUBJECT...";
                inputGroup.classList.add('hidden');
            }
        }

        if(state.phase === 'interrogating') {
            inputGroup.classList.remove('hidden');
            status.innerText = isSubject ? "ANSWER THEIR QUESTIONS!" : "IS THE SUBJECT LYING?";
            sendBtn.innerText = "SEND";
            sendBtn.onclick = () => {
                const val = document.getElementById('mainInput').value;
                if(!val) return;
                db.ref(`rooms/${roomId}/state/log`).push({u: myName, m: val});
                document.getElementById('mainInput').value = "";
                play(sfx.click);
            };

            // Voting Logic for Host
            if(amIHost) {
                status.innerHTML += `<br><button onclick="endPhase('TRUTH')" style="width:80px; padding:5px; background:var(--success); margin:5px;">TRUTH</button>
                                     <button onclick="endPhase('LIE')" style="width:80px; padding:5px; background:var(--primary); margin:5px;">LIE</button>`;
            }
        }
    }

    function endPhase(guess) {
        play(sfx.win);
        db.ref(`rooms/${roomId}/state`).once('value', snap => {
            const data = snap.val();
            const resultMsg = (guess === 'LIE') ? "CREWMATES WON! CAUGHT THE LIE! 🎉" : "IMPOSTER FOOLED YOU! 😈";
            db.ref(`rooms/${roomId}/state/phase`).set('done');
            db.ref(`rooms/${roomId}/state/log`).push({u: 'RESULT', m: resultMsg});
            document.getElementById('hostStartBtn').classList.remove('hidden');
        });
    }
</script>
</body>
</html>
