<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ioGame</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #FF3B30; --success: #34C759; --accent: #007AFF;
            --glass-bg: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff; --text-muted: rgba(255, 255, 255, 0.7);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.6); --glass-border: rgba(0, 0, 0, 0.1);
                --text-main: #000000; --text-muted: rgba(0, 0, 0, 0.5);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            color: var(--text-main); height: 100dvh; overflow: hidden; display: flex; justify-content: center;
            background: #000 url('desk.png') no-repeat center center fixed; background-size: cover;
            transition: background 0.5s ease;
        }
        @media (max-width: 768px) { body { background-image: url('vert.png'); } }

        .app-container { width: 100%; max-width: 500px; height: 100%; display: flex; flex-direction: column; padding: 20px; position: relative; z-index: 1; }
        
        /* Advanced Apple-Style Glassmorphism */
        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border); border-radius: 32px; padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Typography */
        h1 { font-size: 46px; font-weight: 800; letter-spacing: -2px; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 15px; font-weight: 500; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        
        /* Inputs & Buttons */
        input { 
            width: 100%; background: rgba(150, 150, 150, 0.15); border: 1.5px solid transparent; 
            padding: 18px; border-radius: 20px; color: var(--text-main); outline: none; 
            font-size: 16px; font-weight: 500; margin-bottom: 16px; transition: 0.3s ease; 
        }
        input:focus { border-color: var(--accent); background: rgba(150, 150, 150, 0.25); transform: translateY(-2px); }
        
        button { 
            width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 700; font-size: 16px; 
            cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-transform: uppercase; letter-spacing: 0.8px; 
        }
        button:active { transform: scale(0.94); }
        
        .btn-primary { background: var(--success); color: #fff; box-shadow: 0 8px 20px rgba(52, 199, 89, 0.3); }
        .btn-danger { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3); }
        .btn-accent { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3); }
        .btn-disabled { background: rgba(150, 150, 150, 0.3); color: rgba(255,255,255,0.5); cursor: not-allowed; box-shadow: none; }
        
        .flex-row { display: flex; gap: 12px; margin-top: 10px; }
        .flex-row button { flex: 1; }

        /* Lobby Display */
        .link-display-container {
            display: flex; gap: 8px; margin-bottom: 20px;
        }
        .link-display-container input {
            margin-bottom: 0; padding: 12px 16px; font-size: 14px; color: var(--accent);
            background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border);
        }
        
        .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .p-badge { 
            background: rgba(150, 150, 150, 0.15); border: 1px solid var(--glass-border); border-radius: 18px; 
            padding: 14px; text-align: center; font-weight: 600; font-size: 15px; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Floating Lobby Emojis */
        .floating-emojis { font-size: 24px; text-align: center; margin-bottom: 15px; animation: float 3s ease-in-out infinite; }
        
        /* Game Zones */
        .emoji-showcase { font-size: 90px; text-align: center; margin: 10px 0; text-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .mini-emojis { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; font-size: 20px; opacity: 0.8; margin-bottom: 15px; }
        
        .chat-container { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding-right: 5px; scroll-behavior: smooth; }
        .chat-msg { background: rgba(150, 150, 150, 0.2); padding: 12px 16px; border-radius: 20px 20px 20px 6px; font-size: 15px; width: fit-content; max-width: 85%; animation: slideUp 0.3s ease; line-height: 1.4; }
        .chat-msg b { color: var(--accent); font-weight: 700; }
        
        /* Music Toggle */
        .music-toggle { position: absolute; top: 20px; right: 20px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; z-index: 100; transition: 0.3s; }
        .music-toggle:active { transform: scale(0.9); }

        .hidden { display: none !important; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://assets.mixkit.co/active_storage/sfx/135/135-preview.mp3" type="audio/mpeg">
</audio>
<div class="music-toggle" onclick="toggleMusic()" id="musicBtn">🎵</div>

<div class="app-container">
    <div id="view-login" style="margin-top: 22vh;">
        <h1>ioGame</h1>
        <div class="subtitle">Family Game Night 🎲</div>
        <div class="glass-card">
            <input type="text" id="userName" placeholder="Enter your nickname" maxlength="12">
            <button class="btn-primary" onclick="joinGame()">Enter Lobby</button>
        </div>
    </div>

    <div id="view-lobby" class="hidden">
        <div class="glass-card" style="margin-bottom: 15px;">
            <p style="font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-align: center;">🔗 Invite Friends & Family</p>
            <div class="link-display-container">
                <input type="text" id="lobbyLinkInput" readonly value="">
                <button class="btn-accent" style="width: auto; padding: 0 20px; font-size: 14px;" onclick="copyInviteLink(this)">Copy</button>
            </div>
        </div>
        
        <div class="glass-card">
            <div class="floating-emojis">🍿 🎮 🚀 🎸 🎬</div>
            <h2 id="lobbyStatusText" style="font-size: 18px; margin-bottom: 15px; text-align: center;">Waiting in Lobby...</h2>
            <div class="player-grid" id="lobbyPlayers"></div>
            
            <button id="btnStartGame" class="btn-disabled" onclick="hostStartGame()">Start Game 🔒</button>
        </div>
    </div>

    <div id="view-game" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div class="glass-card" style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 15px;">
            <div id="gameStatus" style="text-align: center; font-weight: 700; color: var(--accent); margin-bottom: 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">System Ready</div>
            
            <div class="mini-emojis" id="emojiVaultDisplay"></div>
            
            <div id="zone-secret" class="hidden" style="margin: auto 0;">
                <div class="emoji-showcase" id="bigEmoji">❓</div>
                <p style="text-align: center; margin-bottom: 25px; font-weight: 600; font-size: 16px;">You are the Main Player!<br><span style="color: var(--text-muted); font-size: 13px;">Do you want to lie or tell the truth?</span></p>
                <div class="flex-row">
                    <button class="btn-primary" onclick="lockStance('truth')">Tell Truth</button>
                    <button class="btn-danger" onclick="lockStance('lie')">Tell Lie</button>
                </div>
            </div>

            <div id="zone-chat" class="chat-container hidden"></div>

            <div id="zone-controls" class="hidden" style="margin-top: auto; padding-top: 15px;">
                <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                    <input type="text" id="chatInput" placeholder="Type a message..." style="margin-bottom: 0;">
                    <button class="btn-primary" style="width: auto; padding: 0 24px;" onclick="sendChatMessage()">Send</button>
                </div>
                
                <div id="voteSection" class="hidden">
                    <p style="text-align: center; font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text-muted);">Is the Main Player lying?</p>
                    <div class="flex-row">
                        <button class="btn-primary" onclick="castVote('truth')">Truth</button>
                        <button class="btn-danger" onclick="castVote('lie')">Lie</button>
                    </div>
                </div>
            </div>

            <div id="zone-result" class="hidden" style="text-align: center; margin: auto 0;">
                <div style="font-size: 70px; margin-bottom: 15px; animation: float 2s infinite;">🏆</div>
                <h2 id="resultText" style="margin-bottom: 25px; font-size: 26px; font-weight: 800; letter-spacing: -1px;"></h2>
                <button id="btnPlayAgain" class="btn-disabled" onclick="hostStartGame()">Waiting for Host...</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyAVREmzFgrnE_1NP9Ke-YbtynlS1Ka-HNk",
        authDomain: "iogame-145c9.firebaseapp.com",
        databaseURL: "https://iogame-145c9-default-rtdb.firebaseio.com",
        projectId: "iogame-145c9",
        storageBucket: "iogame-145c9.firebasestorage.app",
        messagingSenderId: "1024963573565",
        appId: "1:1024963573565:web:907f671f3fad2c56443754"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- EXPANDED EMOJI VAULT ---
    const items = [
        {e:"🍎", n:"Apple"}, {e:"🚗", n:"Car"}, {e:"🍕", n:"Pizza"}, {e:"📱", n:"Phone"}, 
        {e:"⌚", n:"Watch"}, {e:"🎸", n:"Guitar"}, {e:"🚀", n:"Rocket"}, {e:"🍔", n:"Burger"}, 
        {e:"🦄", n:"Unicorn"}, {e:"🍩", n:"Donut"}, {e:"🎮", n:"Controller"}, {e:"🧸", n:"Teddy"}, 
        {e:"🥑", n:"Avocado"}, {e:"🛸", n:"UFO"}, {e:"🏀", n:"Basketball"}, {e:"🎨", n:"Palette"}
    ];

    document.getElementById('emojiVaultDisplay').innerText = items.map(i => i.e).join(' ');

    // --- AUDIO & MUSIC ENGINE ---
    let musicPlaying = false;
    const bgm = document.getElementById('bgMusic');
    bgm.volume = 0.3; 

    function toggleMusic() {
        if (musicPlaying) { bgm.pause(); document.getElementById('musicBtn').innerText = "🔇"; } 
        else { bgm.play().catch(()=>{}); document.getElementById('musicBtn').innerText = "🎵"; }
        musicPlaying = !musicPlaying;
    }

    const sfx = {
        pop: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
        swoosh: new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3'),
        chime: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
        fanfare: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
        start: new Audio('https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3') 
    };
    const playSfx = (sound) => { sound.currentTime = 0; sound.play().catch(()=>{}); };

    // --- GAME VARIABLES ---
    let roomId = new URLSearchParams(window.location.search).get('room') || Math.random().toString(36).substring(7);
    if (!window.location.search.includes('room')) window.history.pushState({}, '', `?room=${roomId}`);
    
    let myKey, myName, amIHost = false;

    // --- CORE FUNCTIONS ---
    function copyInviteLink(btn) { 
        const linkInput = document.getElementById('lobbyLinkInput');
        linkInput.select();
        linkInput.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(linkInput.value); 
        playSfx(sfx.pop); 
        
        const originalText = btn.innerText;
        btn.innerText = "Copied!";
        btn.style.background = "var(--success)";
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "var(--accent)";
        }, 1500);
    }

    function switchView(viewId) {
        ['view-login', 'view-lobby', 'view-game'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
    }

    function joinGame() {
        myName = document.getElementById('userName').value.trim();
        if(!myName) return;
        playSfx(sfx.pop);
        
        if(!musicPlaying) { toggleMusic(); }
        
        const ref = db.ref(`rooms/${roomId}/players`).push();
        myKey = ref.key;
        ref.set({ name: myName, joinedAt: firebase.database.ServerValue.TIMESTAMP }).then(() => {
            document.getElementById('lobbyLinkInput').value = window.location.href;
            switchView('view-lobby');
            listenToLobby();
        });
    }

    function listenToLobby() {
        db.ref(`rooms/${roomId}/players`).on('value', snap => {
            const players = snap.val() || {};
            const keys = Object.keys(players);
            amIHost = (myKey === keys[0]);
            
            const grid = document.getElementById('lobbyPlayers');
            grid.innerHTML = "";
            keys.forEach((id) => {
                grid.innerHTML += `<div class="p-badge">${players[id].name} ${id === keys[0] ? '👑' : ''}</div>`;
            });

            const btnStart = document.getElementById('btnStartGame');
            const lobbyStatus = document.getElementById('lobbyStatusText');
            
            // LOGIC FOR START GAME BUTTON VISIBILITY
            if(amIHost) {
                lobbyStatus.innerText = "You are the Host! 👑";
                btnStart.className = "btn-primary";
                btnStart.innerText = "Start Game 🚀";
                btnStart.disabled = false;
            } else {
                lobbyStatus.innerText = "Waiting for Host to start...";
                btnStart.className = "btn-disabled";
                // Show the start game button to everyone, but lock it for non-hosts
                btnStart.innerText = "Start Game 🔒"; 
                btnStart.disabled = true;
            }
        });

        db.ref(`rooms/${roomId}/state`).on('value', snap => {
            if(snap.val()) handleGameState(snap.val());
        });
    }

    function hostStartGame() {
        if(!amIHost) return; // Failsafe: only host can actually trigger this
        playSfx(sfx.start);
        db.ref(`rooms/${roomId}/players`).once('value', pSnap => {
            const keys = Object.keys(pSnap.val());
            const subject = keys[Math.floor(Math.random() * keys.length)];
            const item = items[Math.floor(Math.random() * items.length)];
            
            db.ref(`rooms/${roomId}/state`).set({
                phase: 'choosing',
                subject: subject,
                item: item,
                chat: [{u: 'System', m: '🤫 The Main Player is making their secret choice...'}],
                votes: {}
            });
        });
    }

    function handleGameState(state) {
        switchView('view-game');
        const isSubject = (myKey === state.subject);
        const status = document.getElementById('gameStatus');
        const chatBox = document.getElementById('zone-chat');
        
        ['zone-secret', 'zone-chat', 'zone-controls', 'voteSection', 'zone-result'].forEach(id => document.getElementById(id).classList.add('hidden'));

        chatBox.innerHTML = "";
        (Object.values(state.chat || {})).forEach(msg => {
            chatBox.innerHTML += `<div class="chat-msg"><b>${msg.u}:</b> ${msg.m}</div>`;
        });
        chatBox.scrollTop = chatBox.scrollHeight;

        if (state.phase === 'choosing') {
            if (isSubject) {
                status.innerText = "Your Secret Item";
                document.getElementById('zone-secret').classList.remove('hidden');
                document.getElementById('bigEmoji').innerText = state.item.e;
            } else {
                status.innerText = "Waiting for Main Player...";
                document.getElementById('zone-chat').classList.remove('hidden');
            }
        }

        if (state.phase === 'interrogation') {
            document.getElementById('zone-chat').classList.remove('hidden');
            document.getElementById('zone-controls').classList.remove('hidden');
            
            if (isSubject) {
                status.innerText = "Interrogation Active - Defend Yourself!";
            } else {
                status.innerText = "Interrogation Active - Ask & Vote!";
                document.getElementById('voteSection').classList.remove('hidden');
            }
        }

        if (state.phase === 'finished') {
            document.getElementById('zone-result').classList.remove('hidden');
            document.getElementById('resultText').innerText = state.winner;
            
            const btnReplay = document.getElementById('btnPlayAgain');
            if(amIHost) {
                btnReplay.className = "btn-primary";
                btnReplay.innerText = "Start Next Round 🚀";
                btnReplay.disabled = false;
            } else {
                btnReplay.className = "btn-disabled";
                btnReplay.innerText = "Start Next Round 🔒";
                btnReplay.disabled = true;
            }
        }
    }

    function lockStance(stance) {
        playSfx(sfx.chime);
        db.ref(`rooms/${roomId}/state/secretStance`).set(stance);
        db.ref(`rooms/${roomId}/state/phase`).set('interrogation');
        db.ref(`rooms/${roomId}/state/chat`).push({u: 'System', m: 'The choice is locked in. Let the interrogation begin! 🕵️‍♂️'});
    }

    function sendChatMessage() {
        const input = document.getElementById('chatInput');
        if(!input.value.trim()) return;
        playSfx(sfx.swoosh);
        db.ref(`rooms/${roomId}/state/chat`).push({u: myName, m: input.value.trim()});
        input.value = "";
    }

    document.getElementById("chatInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendChatMessage();
        }
    });

    function castVote(vote) {
        playSfx(sfx.chime);
        db.ref(`rooms/${roomId}/state/votes/${myKey}`).set(vote);
        
        db.ref(`rooms/${roomId}`).once('value', snap => {
            const data = snap.val();
            const totalPlayers = Object.keys(data.players).length;
            const currentVotes = Object.keys(data.state.votes || {}).length;
            
            if (currentVotes >= totalPlayers - 1) { 
                calculateWinner(data.state);
            }
        });
    }

    function calculateWinner(state) {
        const votes = Object.values(state.votes || {});
        let correctGuesses = 0;
        votes.forEach(v => { if(v === state.secretStance) correctGuesses++; });
        
        const majorityCorrect = correctGuesses > (votes.length / 2);
        const winText = majorityCorrect ? "Cousins Caught the Lie! 🎉" : "The Imposter Won! 😈";
        
        playSfx(sfx.fanfare);
        db.ref(`rooms/${roomId}/state/phase`).set('finished');
        db.ref(`rooms/${roomId}/state/winner`).set(winText);
    }
</script>
</body>
</html>
