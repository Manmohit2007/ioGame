<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ioGame</title>
    <style>
        :root {
            --primary: #FF3B30; --success: #34C759; --accent: #007AFF;
            --glass-bg: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.25);
            --text-main: #E5E5EA; --text-muted: #AEAEB2;
            --text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.5);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.6); --glass-border: rgba(0, 0, 0, 0.1);
                --text-main: #2C2C2E; --text-muted: #48484A;
                --text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9), 0 0 2px rgba(255, 255, 255, 0.5);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: var(--text-main); text-shadow: var(--text-shadow);
            height: 100dvh; overflow: hidden;
            display: flex; justify-content: center;
            background: #000 url('desk.png') no-repeat center center fixed; background-size: cover;
            transition: background 0.5s ease;
        }
        @media (orientation: portrait) { body { background-image: url('vert.png'); } }

        .app-container { 
            width: 100%; max-width: 1200px; height: 100%; 
            display: flex; flex-direction: column; padding: 15px; 
            position: relative; z-index: 1; margin: 0 auto;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        @media (min-width: 768px) { .app-container { padding: 30px; } }

        .view-centered { max-width: 500px; width: 100%; margin: 0 auto; }
        .view-centered-wide { max-width: 700px; width: 100%; margin: 0 auto; }

        .glass-card { 
            background: var(--glass-bg); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @media (min-width: 768px) { .glass-card { border-radius: 32px; padding: 28px; } }

        h1 { font-size: 42px; font-weight: 800; letter-spacing: -2px; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 15px; font-weight: 500; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        @media (min-width: 768px) { h1 { font-size: 52px; } .subtitle { font-size: 18px; } }
        
        input, textarea { 
            width: 100%; background: rgba(150, 150, 150, 0.15); border: 1.5px solid transparent; 
            padding: 16px; border-radius: 16px; color: #fff; outline: none; text-shadow: none;
            font-size: 16px; font-weight: 500; margin-bottom: 12px; transition: 0.3s ease; 
            font-family: inherit;
        }
        @media (prefers-color-scheme: light) { input, textarea { color: #000; } }
        input:focus, textarea:focus { border-color: var(--accent); background: rgba(150, 150, 150, 0.25); transform: translateY(-2px); }
        input::placeholder, textarea::placeholder { color: rgba(255, 255, 255, 0.8); }
        @media (prefers-color-scheme: light) { input::placeholder, textarea::placeholder { color: rgba(0, 0, 0, 0.5); } }
        
        button { 
            width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 700; font-size: 16px; 
            cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.8px; text-shadow: none;
        }
        button:active { transform: scale(0.96); }
        .btn-primary { background: var(--success); color: #fff; box-shadow: 0 8px 20px rgba(52, 199, 89, 0.3); }
        .btn-danger { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3); }
        .btn-accent { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3); }
        .btn-disabled { background: rgba(150, 150, 150, 0.3); color: rgba(255,255,255,0.5); cursor: not-allowed; box-shadow: none; }

        .link-display-container { display: flex; gap: 8px; margin-bottom: 20px; }
        .link-display-container input { margin-bottom: 0; padding: 12px 16px; color: var(--accent); } 
        
        .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        @media (min-width: 768px) { .player-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .player-grid { grid-template-columns: repeat(4, 1fr); } }

        .p-badge { 
            background: rgba(150, 150, 150, 0.15); border: 1px solid var(--glass-border); border-radius: 14px; 
            padding: 12px; text-align: center; font-weight: 600; font-size: 14px; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        #view-game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        #view-game > .glass-card { flex: 1; display: flex; flex-direction: column; padding: 15px; min-height: 0; }
        @media (min-width: 768px) { #view-game > .glass-card { padding: 24px; } }

        .game-content-split {
            display: flex; flex-direction: column; flex: 1; gap: 12px; min-height: 0;
        }

        @media (min-width: 768px) {
            .game-content-split { flex-direction: row; gap: 20px; }
        }

        .board-section {
            flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
            min-height: 250px; 
        }
        @media (min-width: 768px) { .board-section { flex: 1.5; min-height: 0; } }
        @media (min-width: 1024px) { .board-section { flex: 2; } }

        .chat-section {
            display: flex; flex-direction: column; flex: 1; min-height: 200px; max-height: 40vh;
            background: rgba(0,0,0,0.15); border-radius: 20px; border: 1px solid var(--glass-border);
            overflow: hidden; flex-shrink: 0;
        }
        @media (min-width: 768px) { 
            .chat-section { width: 320px; height: 100%; max-height: none; flex: none; min-height: 0; } 
        }
        @media (min-width: 1024px) { 
            .chat-section { width: 380px; } 
        }

        .chat-scroll {
            flex: 1; padding: 15px; overflow-y: auto; scroll-behavior: smooth;
            display: flex; flex-direction: column; gap: 8px; min-height: 0;
            scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent;
        }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: var(--glass-border); border-radius: 10px; }

        .chat-msg { 
            padding: 8px 12px; font-size: 13px; width: fit-content; max-width: 90%; 
            animation: slideUp 0.3s ease; line-height: 1.3; backdrop-filter: blur(10px);
            border-radius: 16px; touch-action: pan-y; will-change: transform; transition: transform 0.2s;
            word-break: break-word;
        }
        @media (hover: hover) {
            .chat-msg:not(.chat-system):hover { transform: translateX(3px); cursor: grab; }
            .chat-msg:not(.chat-system):active { cursor: grabbing; }
        }
        
        .chat-reply-quote {
            background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent); padding: 4px 8px;
            border-radius: 4px; margin-bottom: 4px; font-size: 11px; color: var(--text-muted); text-shadow: none;
        }
        .chat-system { 
            margin: 4px auto; font-size: 11px; font-weight: 600; color: var(--text-muted); 
            background: transparent !important; border: none !important; font-style: italic; text-align: center;
        }

        .chat-input-area {
            padding: 12px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--glass-border);
        }
        .chat-input-area input, .chat-input-area textarea { margin-bottom: 0; padding: 12px; font-size: 14px; border-radius: 12px; }
        .chat-input-area textarea { height: 60px; min-height: 60px; max-height: 60px; resize: none; overflow-y: auto; line-height: 1.4; scrollbar-width: thin; }
        .chat-input-area button { padding: 12px 18px; font-size: 14px; border-radius: 12px; height: 60px; }

        #status-container { text-align: center; min-height: 40px; margin-bottom: 8px; }
        .fruit-btn {
            width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); border: 2px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: none; flex-shrink: 0;
        }
        @media (min-width: 768px) { .fruit-btn { width: 44px; height: 44px; font-size: 22px; } }
        .fruit-btn:active { transform: scale(0.9); }
        .fruit-btn.active-vote { 
            border-color: var(--success); background: rgba(52, 199, 89, 0.3); 
            box-shadow: 0 0 15px rgba(52, 199, 89, 0.5); transform: scale(1.1);
        }

        .player-node {
            position: absolute; width: 55px; height: 55px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: translate(-50%, -50%); z-index: 5; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: border-color 0.4s ease, box-shadow 0.4s ease, width 0.3s, height 0.3s;
        }
        @media (min-width: 768px) { .player-node { width: 65px; height: 65px; } }
        @media (min-width: 1024px) { .player-node { width: 75px; height: 75px; } }

        .score-badge {
            position: absolute; top: -6px; right: -6px; background: var(--accent); color: #fff; text-shadow: none;
            font-size: 11px; font-weight: bold; width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 2px solid rgba(0,0,0,0.4); z-index: 6;
        }
        @media (min-width: 768px) { .score-badge { width: 26px; height: 26px; font-size: 13px; top: -4px; right: -4px; } }
        
        .player-node.active-target-glow { border-color: var(--primary) !important; box-shadow: 0 0 20px 5px rgba(255, 59, 48, 0.6), inset 0 0 10px rgba(255, 59, 48, 0.4) !important; }
        .player-node.voted-glow { border-color: var(--success) !important; box-shadow: 0 0 20px 5px rgba(52, 199, 89, 0.6), inset 0 0 10px rgba(52, 199, 89, 0.4) !important; }

        .node-color { width: 12px; height: 12px; border-radius: 50%; margin-bottom: 2px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
        @media (min-width: 768px) { .node-color { width: 16px; height: 16px; margin-bottom: 4px; } }
        
        .node-name {
            font-size: 10px; font-weight: 800; color: #fff; text-align: center; white-space: nowrap; overflow: hidden; 
            text-overflow: ellipsis; max-width: 90%; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        @media (min-width: 768px) { .node-name { font-size: 12px; } }

        @keyframes countdownBlink { 0%, 100% { border-color: var(--glass-border); box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: translate(-50%, -50%) scale(1); } 50% { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 25px rgba(255,255,255,0.6); transform: translate(-50%, -50%) scale(1.05); } }
        .node-blink { animation: countdownBlink 1s ease-in-out infinite !important; }
        @keyframes votePopAnim { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } }

        .center-orb {
            position: relative; width: 140px; height: 140px; border-radius: 50%; background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--glass-border);
            z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 15px 35px rgba(0,0,0,0.2); overflow: hidden; 
            animation: popIn 0.5s ease; transition: width 0.3s, height 0.3s;
        }
        @media (min-width: 768px) { .center-orb { width: 180px; height: 180px; } }
        @media (min-width: 1024px) { .center-orb { width: 220px; height: 220px; } }

        .countdown-view { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; text-align: center; padding: 10px; }

        .music-toggle { position: absolute; top: 15px; right: 15px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; z-index: 100; transition: 0.3s; }
        @media (min-width: 768px) { .music-toggle { top: 25px; right: 25px; width: 50px; height: 50px; font-size: 22px; } }
        .music-toggle:active { transform: scale(0.9); }

        .hidden { display: none !important; }

        @keyframes confettiFall { 0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; } }
        .confetti { position: absolute; width: 12px; height: 12px; z-index: 9999; pointer-events: none; border-radius: 2px; animation: confettiFall linear forwards; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes popInNode { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<div class="music-toggle" onclick="window.toggleMusic()" id="musicBtn">🎵</div>

<div class="app-container">
    <!-- VIEW: LOGIN -->
    <div id="view-login" class="view-centered" style="margin-top: 20vh;">
        <h1>ioGame</h1>
        <div class="subtitle">Family Game Night 🎲</div>
        <div class="glass-card">
            <input type="text" id="userName" placeholder="Enter Your Nickname" maxlength="12">
            <button class="btn-primary" onclick="window.joinGame()">Enter Lobby</button>
        </div>
    </div>

    <!-- VIEW: LOBBY -->
    <div id="view-lobby" class="view-centered-wide hidden" style="margin-top: 10vh;">
        <div class="glass-card" style="margin-bottom: 15px;">
            <p style="font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-align: center;">🔗 Invite Friends & Family</p>
            <div class="link-display-container">
                <input type="text" id="lobbyLinkInput" readonly value="">
                <button class="btn-accent" style="width: auto; padding: 0 20px; font-size: 14px;" onclick="window.copyInviteLink(this)">Copy</button>
            </div>
        </div>
        
        <div class="glass-card">
            <div id="lobbyEmojiDisplay" style="font-size: 32px; letter-spacing: 5px; text-align: center; margin-bottom: 10px; animation: float 3s infinite; text-shadow:none;"></div>
            <h2 id="lobbyStatusText" style="font-size: 18px; margin-bottom: 20px; text-align: center;">Waiting in Lobby...</h2>
            <div class="player-grid" id="lobbyPlayers"></div>
            
            <button id="btnStartGame" class="btn-disabled" onclick="window.hostStartGame()" style="display:none;">Start Game 🔒</button>
            <button class="btn-danger" style="margin-top: 12px;" onclick="window.leaveRoom()">Leave Room</button>
        </div>
    </div>

    <!-- VIEW: IN-GAME -->
    <div id="view-game" class="hidden">
        <div class="glass-card">
            
            <div id="status-container">
                <div id="gameStatus" class="hidden" style="font-weight: 700; color: var(--accent); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">System Ready</div>
                
                <div id="voting-header" class="hidden" style="display:flex; align-items:center; justify-content:center; gap:8px;">
                    <div id="voting-fruits" style="display:flex; gap:6px; flex-wrap:nowrap;"></div>
                    <button id="btnSubmitVote" class="btn-accent" style="padding: 10px 14px; font-size:12px; width:auto; border-radius: 12px; display:none; flex-shrink:0;" onclick="window.submitVote()">VOTE</button>
                </div>
                
                <div id="target-message" class="hidden" style="color:var(--primary); font-weight:bold; font-size:15px;">🎯 You are the Target! Answer their questions.</div>
            </div>
            
            <div id="emojiVaultDisplay" style="text-align:center; font-size: 32px; letter-spacing: 5px; text-shadow:none; margin-bottom:10px; opacity:0.9;"></div>

            <div id="game-content-split" class="game-content-split hidden">
                
                <div class="board-section" id="zone-circular-board">
                    <div id="player-nodes-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
                    
                    <div id="center-glass-orb" class="center-orb">
                        <div id="center-countdown" class="countdown-view hidden">
                            <p style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; text-transform: uppercase;">Your Fruit</p>
                            <div id="bigEmoji" style="font-size: 55px; line-height: 1.1; text-shadow: 0 5px 15px rgba(0,0,0,0.3);">❓</div>
                            <div id="countdownDisplay" style="font-size: 16px; font-weight: bold; color: var(--accent); margin-top:5px;">5...</div>
                        </div>

                        <div id="center-transition" class="countdown-view hidden">
                            <p style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase;">Next Turn</p>
                            <div id="transitionPlayerName" style="font-size: 22px; font-weight: 900; color: var(--accent); text-shadow: 0 0 15px rgba(0,122,255,0.5); text-transform: uppercase;">Player</div>
                        </div>

                        <div id="center-playing" class="countdown-view hidden">
                            <p style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase;">Current Target</p>
                            <div id="playingTargetName" style="font-size: 22px; font-weight: 900; color: var(--accent); text-shadow: 0 0 15px rgba(0,122,255,0.5); text-transform: uppercase;">Name</div>
                        </div>
                    </div>
                </div>

                <div class="chat-section" id="chat-panel-container">
                    <div id="center-chat" class="chat-scroll"></div>
                    
                    <div class="chat-input-area">
                        <div id="reply-indicator" class="hidden" style="background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent); padding: 5px 10px; margin-bottom: 8px; border-radius: 6px; display:flex; justify-content:space-between; align-items:center; font-size: 11px; text-shadow: none;">
                            <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:85%;">
                                <b id="reply-user" style="color:var(--accent);"></b><br>
                                <span id="reply-text" style="color:#aaa;"></span>
                            </div>
                            <button onclick="window.clearReply()" style="background:none; border:none; color:white; width:auto; padding:0; font-size:18px; text-shadow:none;">×</button>
                        </div>

                        <div style="display: flex; gap: 8px;">
                            <textarea id="chatInput" placeholder="Message..." autocomplete="off"></textarea>
                            <button class="btn-primary" style="width: auto;" onclick="window.sendChatMessage()">Send</button>
                        </div>
                    </div>
                </div>

            </div>

            <div id="zone-result" class="hidden" style="text-align: center; margin: auto 0; animation: popIn 0.5s ease; width:100%; max-width: 600px; margin: 0 auto;">
                <div id="resultEmoji" style="font-size: 70px; margin-bottom: 10px; animation: float 2s infinite;">🎉</div>
                <h2 id="resultText" style="margin-bottom: 20px; font-size: 24px; font-weight: 800; line-height: 1.2;"></h2>
                
                <div id="host-controls" class="hidden">
                    <button id="btnPlayAgain" class="btn-primary" onclick="window.hostStartGame()">Play Again 🚀</button>
                    <button class="btn-danger" style="margin-top: 12px;" onclick="window.leaveRoom()">Leave Room</button>
                </div>
                <div id="non-host-message" class="hidden" style="color:var(--text-muted); font-weight:bold;">Waiting for Host...</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, onDisconnect, remove, update, push } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

      apiKey: "AIzaSyAVREmzFgrnE_1NP9Ke-Ybtyn1S1Ka-HNk",

      databaseURL: "https://iogame-145c9-default-rtdb.firebaseio.com",
      projectId: "iogame-145c9",

      messagingSenderId: "1024963573565",

      measurementId: "G-N1J57G3WS6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Global Logic State
    window.globalPlayers = {};
    window.localState = { phase: 'login', chat: {}, votes: {}, scores: {}, turnIndex: 0, turnOrder: [] };
    
    const items = [ {e:"🍎", n:"Apple"}, {e:"🥭", n:"Mango"}, {e:"🍉", n:"Watermelon"}, {e:"🍇", n:"Grapes"}, {e:"🍓", n:"Strawberry"}, {e:"🍊", n:"Orange"} ];
    document.getElementById('emojiVaultDisplay').innerText = items.map(i => i.e).join(' ');
    document.getElementById('lobbyEmojiDisplay').innerText = items.map(i => i.e).join(' ');

    let musicPlaying = false;
    const bgm = document.getElementById('bgMusic'); bgm.volume = 0.15; 
    const sfx = {
        pop: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'), 
        circlePop: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'), 
        vote: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),      
        send: new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3'),     
        receive: new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3'),   
        start: new Audio('https://assets.mixkit.co/active_storage/sfx/2586/2586-preview.mp3'), 
        win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),       
        cheer: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
        tick: new Audio('https://assets.mixkit.co/active_storage/sfx/2574/2574-preview.mp3'), 
        alert: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
    };
    Object.values(sfx).forEach(sound => sound.volume = 0.6);
    const playSfx = (sound) => { if(sound) { const c = sound.cloneNode(); c.volume = sound.volume; c.play().catch(()=>{}); } };

    window.toggleMusic = function() {
        playSfx(sfx.pop); 
        if (musicPlaying) { bgm.pause(); document.getElementById('musicBtn').innerText = "🔇"; } 
        else { bgm.play().catch(()=>{}); document.getElementById('musicBtn').innerText = "🎵"; }
        musicPlaying = !musicPlaying;
    }

    let myUid, myName, currentRoom = new URLSearchParams(window.location.search).get('room');
    let amIHost = false, hostId = null, lastPhase = '', lastChatCount = 0, pendingVoteFruit = null, activeReply = null; 

    function getUserColorByName(name) {
        const keys = Object.keys(window.globalPlayers);
        const index = keys.findIndex(k => window.globalPlayers[k].name === name);
        if (index === -1) { let h = 0; for(let i=0; i<name.length; i++) h=name.charCodeAt(i)+((h<<5)-h); return `hsl(${Math.abs(h)%360}, 85%, 65%)`; }
        return `hsl(${index * (360 / keys.length)}, 85%, 65%)`;
    }

    window.copyInviteLink = function(btn) { 
        const linkInput = document.getElementById('lobbyLinkInput'); linkInput.select(); navigator.clipboard.writeText(linkInput.value); 
        playSfx(sfx.pop); const originalText = btn.innerText; btn.innerText = "Copied!"; btn.style.background = "var(--success)";
        setTimeout(() => { btn.innerText = originalText; btn.style.background = "var(--accent)"; }, 1500);
    }

    function switchView(viewId) {
        ['view-login', 'view-lobby', 'view-game'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
        if(viewId === 'view-game') setTimeout(() => renderBoardNodes(false), 100); 
    }
    
    window.leaveRoom = function() { 
        playSfx(sfx.pop); 
        const baseUrl = window.location.href.split('?')[0];
        window.location.replace(baseUrl); 
    }

    function createConfetti() {
        const colors = ['#FF3B30', '#34C759', '#007AFF', '#FFD700', '#FF9500', '#AF52DE'];
        for (let i = 0; i < 80; i++) {
            let conf = document.createElement('div'); conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw'; conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 2 + 2) + 's'; conf.style.animationDelay = (Math.random() * 0.5) + 's';
            document.body.appendChild(conf); setTimeout(() => conf.remove(), 5000); 
        }
    }

    window.joinGame = async function() {
        let rawName = document.getElementById('userName').value.trim(); 
        if(!rawName) return;
        myName = rawName.charAt(0).toUpperCase() + rawName.slice(1);

        playSfx(sfx.pop); if(!musicPlaying) window.toggleMusic();
        
        try {
            const userCred = await signInAnonymously(auth);
            myUid = userCred.user.uid;
            
            if (!currentRoom) {
                currentRoom = Math.random().toString(36).substring(2, 8).toUpperCase();
                await set(ref(db, `rooms/${currentRoom}/state`), { phase: 'lobby' });
            }
            
            const playerRef = ref(db, `rooms/${currentRoom}/players/${myUid}`);
            await set(playerRef, { name: myName });
            
            // Critical Firebase Cleanup - Automatically kicks out closed/disconnected users instantly
            onDisconnect(playerRef).remove();

            const baseUrl = window.location.href.split('?')[0];
            document.getElementById('lobbyLinkInput').value = `${baseUrl}?room=${currentRoom}`;
            switchView('view-lobby');
            setupFirebaseListeners();
            setupSwipeToReply();
        } catch(e) {
            console.error("Auth failed:", e);
            const nameInput = document.getElementById('userName');
            nameInput.value = "";
            nameInput.placeholder = "Auth Error - Check Firebase settings!";
            nameInput.style.borderColor = "var(--primary)";
        }
    }

    function setupFirebaseListeners() {
        const playersRef = ref(db, `rooms/${currentRoom}/players`);
        const stateRef = ref(db, `rooms/${currentRoom}/state`);

        onValue(playersRef, (snapshot) => {
            const players = snapshot.val() || {};
            window.globalPlayers = players;
            
            // Evict if I got removed
            if (myUid && !players[myUid] && window.localState.phase !== 'login') {
                 const baseUrl = window.location.href.split('?')[0];
                 window.location.replace(baseUrl);
                 return;
            }

            const pKeys = Object.keys(players).sort();
            if(pKeys.length > 0) {
                hostId = pKeys[0];
                amIHost = (hostId === myUid);
            }

            if (window.localState.phase === 'lobby') renderLobby();
            if (document.getElementById('zone-circular-board').offsetParent !== null) renderBoardNodes(false);
            
            // Check turn resolution (Host only, and if playing)
            if (amIHost && window.localState.phase === 'playing') checkTurnResolution();
        });

        onValue(stateRef, (snapshot) => {
            const state = snapshot.val();
            if(state) {
                window.localState = state;
                handleGameState(window.localState);
                if (amIHost && state.phase === 'playing') checkTurnResolution();
            } else if (window.localState.phase !== 'login') {
                const baseUrl = window.location.href.split('?')[0];
                window.location.replace(baseUrl);
            }
        });
    }

    function updateFirebaseState(updates) {
        if(!currentRoom) return;
        update(ref(db, `rooms/${currentRoom}/state`), updates);
    }
    
    function sendSystemMessage(msg) {
        const chatRef = push(ref(db, `rooms/${currentRoom}/state/chat`));
        set(chatRef, { u: 'System', m: msg });
    }

    function renderLobby() {
        const grid = document.getElementById('lobbyPlayers'); grid.innerHTML = "";
        
        // Render current globalPlayers cleanly
        Object.keys(window.globalPlayers).forEach(id => {
            grid.innerHTML += `<div class="p-badge">${window.globalPlayers[id].name} ${id===hostId ? '👑' : ''}</div>`;
        });
        
        document.getElementById('lobbyStatusText').innerText = amIHost ? "You are the Host! 👑" : "Waiting for Host to start...";
        
        const btn = document.getElementById('btnStartGame');
        if (amIHost && Object.keys(window.globalPlayers).length > 1) {
            btn.className = "btn-primary"; btn.innerText = "Start Game 🚀"; btn.disabled = false; btn.style.display = 'block';
        } else if (amIHost) {
             btn.className = "btn-disabled"; btn.innerText = "Need more players..."; btn.disabled = true; btn.style.display = 'block';
        } else {
             btn.style.display = 'none';
        }
    }

    window.hostStartGame = function() {
        if(!amIHost) return;
        playSfx(sfx.start); pendingVoteFruit = null; window.clearReply();
        
        const keys = Object.keys(window.globalPlayers);
        let shuffledItems = [...items].sort(() => 0.5 - Math.random());
        let playerItems = {}, initScores = {};
        keys.forEach((k, i) => { playerItems[k] = shuffledItems[i % shuffledItems.length]; initScores[k] = 0; });
        
        // Wipe old chat & state clean on new game
        set(ref(db, `rooms/${currentRoom}/state`), {
            phase: 'countdown', 
            playerItems: playerItems, 
            countdown: 5, 
            votes: null, 
            scores: initScores, 
            turnOrder: keys, 
            turnIndex: 0
        });
        sendSystemMessage(`🍎 Game started! Memorize your secret fruit.`);

        let timer = 5;
        let interval = setInterval(() => {
            timer--;
            if (timer > 0) { 
                updateFirebaseState({ countdown: timer }); 
                playSfx(sfx.tick);
            } 
            else { 
                clearInterval(interval); 
                playSfx(sfx.pop); 
                startTurn(); 
            }
        }, 1000);
    }

    function startTurn() {
        if(!amIHost) return;
        const targetId = window.localState.turnOrder[window.localState.turnIndex];
        sendSystemMessage(`🔴 Target Acquired: Guess ${window.globalPlayers[targetId].name}'s fruit!`);
        updateFirebaseState({ phase: 'playing', votes: null });
    }

    function handleGameState(state) {
        const isNewPhase = state.phase !== lastPhase;
        switchView(state.phase === 'lobby' ? 'view-lobby' : 'view-game');
        
        const status = document.getElementById('gameStatus');
        const chatBox = document.getElementById('center-chat');
        const votingHeader = document.getElementById('voting-header');
        const targetMessage = document.getElementById('target-message');
        const splitView = document.getElementById('game-content-split');
        const resultView = document.getElementById('zone-result');
        
        const chatValues = state.chat ? Object.values(state.chat) : [];
        chatBox.innerHTML = "";
        chatValues.forEach(msg => {
            if (msg.u === 'System') { chatBox.innerHTML += `<div class="chat-msg chat-system">${msg.m}</div>`; } 
            else {
                const pColor = getUserColorByName(msg.u);
                const align = (msg.u === myName) ? 'margin-left: auto; border-bottom-right-radius: 4px;' : 'margin-right: auto; border-bottom-left-radius: 4px;';
                const bgStyle = `background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-left: 4px solid ${pColor};`;
                let quoteHtml = msg.replyTo ? `<div class="chat-reply-quote"><b>${msg.replyTo.u}</b>: ${msg.replyTo.m}</div>` : '';
                chatBox.innerHTML += `<div class="chat-msg" style="${align} ${bgStyle}" data-u="${msg.u}" data-m="${msg.m}">${quoteHtml}<b style="color: ${pColor}; font-size: 11px;">${msg.u}</b><br><span style="color: var(--text-main);">${msg.m}</span></div>`;
            }
        });
        setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);

        if (chatValues.length < lastChatCount) lastChatCount = 0;
        if (chatValues.length > lastChatCount) {
            const lastMsg = chatValues[chatValues.length - 1];
            if (lastMsg.u !== myName && lastMsg.u !== 'System' && lastChatCount !== 0) playSfx(sfx.receive);
            lastChatCount = chatValues.length;
        }

        if (state.phase !== 'finished' && state.phase !== 'lobby') {
            splitView.classList.remove('hidden');
            resultView.classList.add('hidden');
            document.getElementById('emojiVaultDisplay').classList.remove('hidden');
        }

        ['center-countdown', 'center-transition', 'center-playing'].forEach(id => document.getElementById(id).classList.add('hidden'));

        if (state.phase === 'countdown') {
            status.innerText = "Memorize Your Fruit!"; status.classList.remove('hidden');
            votingHeader.classList.add('hidden'); targetMessage.classList.add('hidden');
            document.getElementById('center-countdown').classList.remove('hidden');
            if(state.playerItems && state.playerItems[myUid]) document.getElementById('bigEmoji').innerText = state.playerItems[myUid].e;
            document.getElementById('countdownDisplay').innerText = `Starts in ${state.countdown}...`;
            renderBoardNodes(isNewPhase); 
        }

        if (state.phase === 'playing' && state.turnOrder) {
            document.getElementById('emojiVaultDisplay').classList.add('hidden'); 
            status.classList.add('hidden'); 
            document.getElementById('center-playing').classList.remove('hidden');
            document.getElementById('playingTargetName').innerText = window.globalPlayers[state.turnOrder[state.turnIndex]]?.name || 'Player';
            renderVotingUI(); renderBoardNodes(isNewPhase); 
        }

        if (state.phase === 'readingResults') {
            document.getElementById('emojiVaultDisplay').classList.add('hidden'); 
            status.classList.add('hidden'); votingHeader.classList.add('hidden');
            document.getElementById('center-playing').classList.remove('hidden');
            targetMessage.classList.remove('hidden'); targetMessage.innerText = "Turn Ended! Checking Scores...";
            renderBoardNodes(isNewPhase); 
        }

        if (state.phase === 'turnTransition') {
            document.getElementById('emojiVaultDisplay').classList.add('hidden'); 
            status.classList.add('hidden'); votingHeader.classList.add('hidden'); targetMessage.classList.add('hidden');
            document.getElementById('center-transition').classList.remove('hidden');
            document.getElementById('transitionPlayerName').innerText = state.nextTargetName;
            renderBoardNodes(isNewPhase); 
        }

        if (state.phase === 'finished') {
            splitView.classList.add('hidden'); resultView.classList.remove('hidden');
            document.getElementById('emojiVaultDisplay').classList.remove('hidden');
            votingHeader.classList.add('hidden'); targetMessage.classList.add('hidden'); status.classList.add('hidden');
            
            const sortedPlayers = Object.keys(window.globalPlayers).sort((a, b) => (state.scores[b] || 0) - (state.scores[a] || 0));
            const winners = sortedPlayers.filter(p => (state.scores[p] || 0) === (state.scores[sortedPlayers[0]] || 0)).map(p => window.globalPlayers[p].name);
            let chartHtml = `<div style="text-align:left; background:rgba(0,0,0,0.3); padding:15px; border-radius:16px; margin-bottom:20px; font-size:15px;">`;
            sortedPlayers.forEach((p, i) => { chartHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px;"><span><b>#${i+1}</b> ${window.globalPlayers[p].name}</span><span style="color:var(--accent); font-weight:bold;">${state.scores[p] || 0} pts</span></div>`; });
            
            document.getElementById('resultText').innerHTML = `<div style="font-size: 38px; font-weight: 900; color: #FFD700; text-shadow: 0 0 25px rgba(255,215,0,0.6); margin-bottom: 5px;">${winners.join(' & ')}</div><div style="font-size: 18px; font-weight: 800; color: var(--success); letter-spacing: 2px; margin-bottom: 20px;">WINNER!</div>${chartHtml}</div>`;
            
            if (amIHost) { document.getElementById('host-controls').classList.remove('hidden'); document.getElementById('non-host-message').classList.add('hidden'); }
            else { document.getElementById('host-controls').classList.add('hidden'); document.getElementById('non-host-message').classList.remove('hidden'); }
            
            if (lastPhase !== 'finished') { playSfx(sfx.win); playSfx(sfx.cheer); createConfetti(); }
        }
        
        if (isNewPhase && lastPhase !== '') playSfx(sfx.circlePop);
        lastPhase = state.phase;
    }

    function renderVotingUI() {
        const container = document.getElementById('voting-fruits'), btnSubmit = document.getElementById('btnSubmitVote');
        const targetMsg = document.getElementById('target-message'), votingHeader = document.getElementById('voting-header');
        const targetId = window.localState.turnOrder[window.localState.turnIndex];
        
        if (myUid === targetId) { votingHeader.classList.add('hidden'); targetMsg.classList.remove('hidden'); return; } 
        else { votingHeader.classList.remove('hidden'); targetMsg.classList.add('hidden'); }

        const hasVoted = window.localState.votes && window.localState.votes[myUid];
        if(hasVoted) { container.innerHTML = `<span style="font-weight:bold; color:var(--success); font-size: 14px;">✅ Locked: ${window.localState.votes[myUid]}</span>`; btnSubmit.style.display = 'none'; return; }

        container.innerHTML = items.map(i => `<div class="fruit-btn ${pendingVoteFruit === i.e ? 'active-vote' : ''}" onclick="window.selectVoteFruit('${i.e}')">${i.e}</div>`).join('');
        btnSubmit.style.display = pendingVoteFruit ? 'block' : 'none';
    }

    window.selectVoteFruit = function(f) { if(window.localState.votes && window.localState.votes[myUid]) return; playSfx(sfx.pop); pendingVoteFruit = f; renderVotingUI(); }
    
    window.submitVote = function() {
        if(!pendingVoteFruit || !currentRoom) return;
        const updates = {};
        updates[`rooms/${currentRoom}/state/votes/${myUid}`] = pendingVoteFruit;
        update(ref(db), updates);
        sendSystemMessage(`${myName} locked in their vote! ✅`);
    }

    function checkTurnResolution() {
        if (window.localState.phase !== 'playing' || !amIHost) return;
        
        const targetId = window.localState.turnOrder[window.localState.turnIndex];
        const numVotes = Object.keys(window.localState.votes || {}).length;
        const activePlayers = Object.keys(window.globalPlayers).length;
        
        // Host calculates if everyone except target has voted
        if(numVotes >= activePlayers - 1) {
            updateFirebaseState({ phase: 'readingResults' });
            
            const targetFruit = window.localState.playerItems[targetId]?.e || '❓';
            let correct = [];
            let newScores = { ...window.localState.scores };
            
            for(let [pid, vote] of Object.entries(window.localState.votes || {})) {
                if(vote === targetFruit && window.globalPlayers[pid]) { 
                    newScores[pid] = (newScores[pid] || 0) + 10; 
                    correct.push(window.globalPlayers[pid].name); 
                }
            }
            
            updateFirebaseState({ scores: newScores });
            sendSystemMessage(`Target ${window.globalPlayers[targetId]?.name || 'Player'} had ${targetFruit}! ` + (correct.length > 0 ? `${correct.join(', ')} guessed correctly (+10)!` : `Nobody guessed correctly (0 pts)!`));
            playSfx(sfx.alert);
            
            setTimeout(() => {
                let nextIndex = window.localState.turnIndex + 1;
                if(nextIndex >= activePlayers) {
                    updateFirebaseState({ phase: 'finished' });
                } else { 
                    updateFirebaseState({ 
                        phase: 'turnTransition', 
                        nextTargetName: window.globalPlayers[window.localState.turnOrder[nextIndex]]?.name || 'Player',
                        turnIndex: nextIndex,
                        votes: null
                    }); 
                    setTimeout(() => startTurn(), 3000); 
                }
            }, 4000);
        }
    }

    function renderBoardNodes(isNewPhase = false) {
        const board = document.getElementById('zone-circular-board');
        if(!board || board.offsetParent === null) return; 
        
        const nodesContainer = document.getElementById('player-nodes-container');
        const keys = Object.keys(window.globalPlayers), N = keys.length, angleStep = (Math.PI * 2) / N, startAngle = (N === 2) ? Math.PI : -Math.PI / 2; 

        // CRITICAL FIX: Aggressive cleanup of ghost players disconnected from Firebase
        const existingNodes = document.querySelectorAll('.player-node');
        existingNodes.forEach(node => {
            const pid = node.id.replace('node-', '');
            if (!window.globalPlayers[pid]) {
                node.remove(); // Safely remove missing players to prevent glitches
            }
        });

        const minDimension = Math.min(board.clientWidth, board.clientHeight);
        const orbRadius = window.innerWidth >= 1024 ? 110 : (window.innerWidth >= 768 ? 90 : 70);
        const nodeRadiusOffset = window.innerWidth >= 768 ? 40 : 30;
        const radius = Math.max(orbRadius + nodeRadiusOffset, (minDimension / 2) - nodeRadiusOffset - 10);

        if (isNewPhase) nodesContainer.innerHTML = '';

        keys.forEach((pid, index) => {
            const angle = startAngle + (index * angleStep);
            const pData = window.globalPlayers[pid], pColor = getUserColorByName(pData.name);
            const isActiveTarget = pid === (window.localState.turnOrder ? window.localState.turnOrder[window.localState.turnIndex] : null) && window.localState.phase !== 'countdown' && window.localState.phase !== 'turnTransition';
            const hasVoted = window.localState.votes && window.localState.votes[pid];
            
            let glowClass = isActiveTarget ? 'active-target-glow' : (hasVoted ? 'voted-glow' : '');
            let nodeEl = document.getElementById(`node-${pid}`);
            
            if (!nodeEl) { 
                nodeEl = document.createElement('div'); nodeEl.id = `node-${pid}`; 
                nodesContainer.appendChild(nodeEl); 
                nodeEl.style.animation = 'popInNode 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; 
            }

            if (hasVoted && !nodeEl.classList.contains('voted-glow')) {
                nodeEl.style.animation = 'none'; void nodeEl.offsetWidth; nodeEl.style.animation = 'votePopAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; playSfx(sfx.vote); 
            }

            nodeEl.className = `player-node ${glowClass} ${window.localState.phase === 'countdown' ? 'node-blink' : ''}`;
            nodeEl.style.left = `calc(50% + ${Math.cos(angle) * radius}px)`; nodeEl.style.top = `calc(50% + ${Math.sin(angle) * radius}px)`;
            nodeEl.style.borderColor = glowClass ? '' : 'var(--glass-border)';
            nodeEl.innerHTML = `<div class="score-badge">${window.localState.scores[pid] || 0}</div><div class="node-color" style="background: ${pColor};"></div><div class="node-name">${pData.name}</div>`;
        });
    }

    window.addEventListener('resize', () => {
        if(document.getElementById('zone-circular-board').offsetParent !== null) renderBoardNodes(false); 
    });

    function setupSwipeToReply() {
        const chatBox = document.getElementById('center-chat'); let startX = 0, swipedElem = null;
        const handleStart = (e, isTouch) => { const el = e.target.closest('.chat-msg'); if(!el || el.classList.contains('chat-system')) return; startX = isTouch ? e.touches[0].clientX : e.clientX; swipedElem = el; swipedElem.style.transition = 'none'; };
        const handleMove = (e, isTouch) => { if(!swipedElem) return; const diffX = (isTouch ? e.touches[0].clientX : e.clientX) - startX; if(diffX > 0 && diffX < 80) swipedElem.style.transform = `translateX(${diffX}px)`; };
        const handleEnd = (e, isTouch) => { if(!swipedElem) return; const diffX = (isTouch ? e.changedTouches[0].clientX : e.clientX) - startX; swipedElem.style.transition = 'transform 0.2s ease'; swipedElem.style.transform = 'translateX(0)'; if(diffX > 40) window.setReply(swipedElem.getAttribute('data-u'), swipedElem.getAttribute('data-m')); swipedElem = null; };

        chatBox.addEventListener('touchstart', e => handleStart(e, true), {passive: true}); chatBox.addEventListener('touchmove', e => handleMove(e, true), {passive: true}); chatBox.addEventListener('touchend', e => handleEnd(e, true));
        chatBox.addEventListener('mousedown', e => handleStart(e, false)); window.addEventListener('mousemove', e => handleMove(e, false)); window.addEventListener('mouseup', e => handleEnd(e, false));
    }

    window.setReply = function(user, msgText) {
        if(user === myName) return; playSfx(sfx.pop); activeReply = { u: user, m: msgText };
        document.getElementById('reply-user').innerText = `Replying to ${user}`; document.getElementById('reply-text').innerText = msgText;
        document.getElementById('reply-indicator').classList.remove('hidden'); document.getElementById('chatInput').focus();
    }
    
    window.clearReply = function() { playSfx(sfx.pop); activeReply = null; document.getElementById('reply-indicator').classList.add('hidden'); }

    window.sendChatMessage = function() {
        const input = document.getElementById('chatInput'); if(!input.value.trim() || !currentRoom) return; playSfx(sfx.send); 
        const payload = { u: myName, m: input.value.trim() }; if(activeReply) { payload.replyTo = activeReply; window.clearReply(); }
        
        const chatRef = push(ref(db, `rooms/${currentRoom}/state/chat`));
        set(chatRef, payload);
        input.value = "";
    }
    
    document.getElementById("chatInput").addEventListener("keypress", function(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); window.sendChatMessage(); } });
</script>
</body>
