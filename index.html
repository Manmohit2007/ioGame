<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ioGame</title>
    <style>
        :root {
            --primary: #FF3B30; --success: #34C759; --accent: #007AFF;
            --glass-bg: rgba(255, 255, 255, 0.22); --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #FFFFFF; --text-muted: #FFFFFF;
            --text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: var(--text-main); text-shadow: var(--text-shadow);
            height: 100dvh; overflow: hidden;
            display: flex; justify-content: center;
            background: #000 url('desk.png') no-repeat center center fixed; background-size: cover;
            transition: background 0.5s ease;
        }
        @media (orientation: portrait) { body { background-image: url('vert.png'); } }

        .app-container { 
            width: 100%; max-width: 1200px; height: 100%; 
            display: flex; flex-direction: column; padding: 15px; 
            position: relative; z-index: 1; margin: 0 auto;
            overflow-y: auto; overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        @media (min-width: 768px) { .app-container { padding: 30px; } }

        .view-centered { max-width: 500px; width: 100%; margin: 0 auto; }
        .view-centered-wide { max-width: 700px; width: 100%; margin: 0 auto; }

        .glass-card { 
            background: var(--glass-bg); backdrop-filter: blur(50px) saturate(150%); -webkit-backdrop-filter: blur(50px) saturate(150%);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @media (min-width: 768px) { .glass-card { border-radius: 32px; padding: 28px; } }

        h1 { font-size: 42px; font-weight: 800; letter-spacing: -2px; text-align: center; margin-bottom: 4px; }
        .subtitle { font-size: 15px; font-weight: 500; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        @media (min-width: 768px) { h1 { font-size: 52px; } .subtitle { font-size: 18px; } }
        
        input, textarea { 
            width: 100%; background: rgba(255, 255, 255, 0.12); border: 1.5px solid transparent; 
            padding: 16px; border-radius: 16px; color: #fff; outline: none; text-shadow: none;
            font-size: 16px; font-weight: 500; margin-bottom: 12px; transition: 0.3s ease; 
            font-family: inherit;
        }
        
        input:focus, textarea:focus { border-color: transparent; background: rgba(255, 255, 255, 0.15); outline: none !important; box-shadow: none !important; }
        
        input::placeholder, textarea::placeholder { color: #ffffff; opacity: 1; font-weight: 600; }

        button { 
            width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 700; font-size: 16px; 
            cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.8px; text-shadow: none;
        }
        button:active { transform: scale(0.96); }
        .btn-primary { background: var(--success); color: #fff; box-shadow: 0 8px 20px rgba(52, 199, 89, 0.3); }
        .btn-danger { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3); }
        .btn-accent { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3); }
        .btn-disabled { background: var(--success); opacity: 0.65; color: rgba(255, 255, 255, 0.9); cursor: not-allowed; box-shadow: none; }

        .link-display-container { display: flex; gap: 8px; margin-bottom: 20px; }
        .link-display-container input { margin-bottom: 0; padding: 12px 16px; color: var(--accent); } 
        
        .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        @media (min-width: 768px) { .player-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .player-grid { grid-template-columns: repeat(4, 1fr); } }

        .p-badge { 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 14px; 
            padding: 12px; text-align: center; font-weight: 600; font-size: 14px; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        #view-game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        
        #view-game > .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 0; min-height: 0; }

        .game-content-split {
            display: flex; flex-direction: column; flex: 1; gap: 12px; min-height: 0;
            margin-top: 0;
        }

        @media (min-width: 768px) and (orientation: landscape), (min-width: 1024px) {
            .game-content-split { flex-direction: row; gap: 24px; margin-top: 0; }
        }

        .board-section {
            flex: 0.8; 
            position: relative; display: flex; align-items: center; justify-content: center;
            min-height: 260px; margin-top: 0; flex-shrink: 0;
            z-index: 10; 
        }

        @media (max-width: 767px) and (orientation: portrait) {
            .board-section {
                transform: translateY(15px);
            }
        }

        .chat-section {
            position: relative;
            z-index: 5; 
            display: flex; flex-direction: column; flex: 1.5; 
            min-height: 250px; max-height: none; 
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(25px) saturate(120%); -webkit-backdrop-filter: blur(25px) saturate(120%);
            border-radius: 20px; border: 1px solid var(--glass-border);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        @media (min-width: 768px) and (max-width: 1023px) and (orientation: portrait) {
            .game-content-split { gap: 20px; margin-top: 1vh; }
            .board-section { flex: 0.8; min-height: 380px; transform: translateY(-2pt); }
            .chat-section { flex: 1.5; min-height: 450px; }
        }

        @media (min-width: 768px) and (orientation: landscape) { 
            .board-section { flex: 1; min-height: 300px; transform: none; }
            .chat-section { width: 320px; height: 100%; max-height: none; flex: none; } 
        }
        @media (min-width: 1024px) { 
            .board-section { margin-top: 0; flex: 1; min-height: 300px; transform: none; }
            .chat-section { width: 380px; height: 100%; max-height: none; flex: none; } 
        }

        .chat-scroll {
            flex: 1; padding: 15px; overflow-y: auto; scroll-behavior: smooth;
            display: flex; flex-direction: column; gap: 8px; min-height: 0;
            scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent;
        }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: var(--glass-border); border-radius: 10px; }

        .chat-msg { 
            padding: 8px 12px; font-size: 13px; width: fit-content; max-width: 90%; 
            animation: slideUp 0.3s ease; line-height: 1.3; backdrop-filter: blur(10px);
            border-radius: 16px; touch-action: pan-y; will-change: transform; transition: transform 0.2s;
            word-break: break-word;
        }
        @media (hover: hover) {
            .chat-msg:not(.chat-system):hover { transform: translateX(3px); cursor: grab; }
            .chat-msg:not(.chat-system):active { cursor: grabbing; }
        }
        
        .chat-reply-quote {
            background: rgba(255, 255, 255, 0.1); border-left: 3px solid; padding: 4px 8px;
            border-radius: 4px; margin-bottom: 4px; font-size: 11px; color: rgba(255, 255, 255, 0.95); text-shadow: none;
        }
        .chat-system { 
            margin: 4px auto; font-size: 11px; font-weight: 600; color: var(--text-muted); 
            background: transparent !important; border: none !important; font-style: italic; text-align: center;
        }

        .chat-input-area {
            padding: 12px; background: rgba(255, 255, 255, 0.05); border-top: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }
        .chat-input-area input, .chat-input-area textarea { margin-bottom: 0; padding: 12px; font-size: 14px; border-radius: 12px; }
        .chat-input-area textarea { height: 60px; min-height: 60px; max-height: 60px; resize: none; overflow-y: auto; line-height: 1.4; scrollbar-width: thin; }
        .chat-input-area button { padding: 12px 18px; font-size: 14px; border-radius: 12px; height: 60px; }

        #status-container { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            text-align: center; margin-bottom: 8px; flex-shrink: 0; 
        }
        @media (min-width: 768px) { #status-container { margin-bottom: 12px; } }

        .fruit-btn {
            width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); border: 2px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: none; flex-shrink: 0;
        }
        @media (min-width: 768px) { .fruit-btn { width: 44px; height: 44px; font-size: 22px; } }
        .fruit-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.25); }
        .fruit-btn:active { transform: scale(0.9); }

        .player-node {
            position: absolute; width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: translate(-50%, -50%); z-index: 5; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: opacity 0.4s ease, filter 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, width 0.3s, height 0.3s;
        }
        @media (min-width: 768px) { .player-node { width: 80px; height: 80px; } }
        @media (min-width: 1024px) { .player-node { width: 100px; height: 100px; } }

        .score-badge {
            position: absolute; top: -6px; right: -6px; background: var(--accent); color: #fff; text-shadow: none;
            font-size: 11px; font-weight: bold; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 2px solid rgba(0,0,0,0.4); z-index: 6;
        }
        @media (min-width: 768px) { .score-badge { width: 30px; height: 30px; font-size: 14px; top: -5px; right: -5px; } }
        @media (min-width: 1024px) { .score-badge { width: 34px; height: 34px; font-size: 16px; top: -6px; right: -6px; } }
        
        .player-node.active-target-glow { border-color: var(--primary) !important; box-shadow: 0 0 20px 5px rgba(255, 59, 48, 0.6), inset 0 0 10px rgba(255, 59, 48, 0.4) !important; }
        .player-node.voted-glow { border-color: var(--success) !important; box-shadow: 0 0 20px 5px rgba(52, 199, 89, 0.6), inset 0 0 10px rgba(52, 199, 89, 0.4) !important; }

        .node-color { width: 14px; height: 14px; border-radius: 50%; margin-bottom: 2px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
        @media (min-width: 768px) { .node-color { width: 18px; height: 18px; margin-bottom: 4px; } }
        @media (min-width: 1024px) { .node-color { width: 22px; height: 22px; margin-bottom: 6px; } }
        
        .node-name {
            font-size: 11px; font-weight: 800; color: #fff; text-align: center; white-space: nowrap; overflow: hidden; 
            text-overflow: ellipsis; max-width: 90%; text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 2px #000;
        }
        @media (min-width: 768px) { .node-name { font-size: 14px; } }
        @media (min-width: 1024px) { .node-name { font-size: 16px; } }

        @keyframes countdownBlink { 0%, 100% { border-color: var(--glass-border); box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: translate(-50%, -50%) scale(1); } 50% { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 25px rgba(255,255,255,0.6); transform: translate(-50%, -50%) scale(1.05); } }
        .node-blink { animation: countdownBlink 1s ease-in-out infinite !important; }
        @keyframes votePopAnim { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } }

        .center-orb {
            position: relative; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--glass-border);
            z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 15px 35px rgba(0,0,0,0.2); overflow: hidden; 
            animation: popIn 0.5s ease; transition: width 0.3s, height 0.3s;
        }
        @media (min-width: 768px) { .center-orb { width: 200px; height: 200px; } }
        @media (min-width: 1024px) { .center-orb { width: 260px; height: 260px; } }

        .countdown-view { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; text-align: center; padding: 10px; }

        .hidden { display: none !important; }

        @keyframes confettiFall { 0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; } }
        .confetti { position: absolute; width: 12px; height: 12px; z-index: 9999; pointer-events: none; border-radius: 2px; animation: confettiFall linear forwards; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes popInNode { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .emoji-row {
            display: flex; justify-content: center; align-items: flex-start; gap: 8px;
            font-size: clamp(24px, 7vw, 32px); flex-wrap: nowrap; white-space: nowrap;
            margin-bottom: 10px; text-shadow: none; width: 100%; overflow: hidden;
        }

        .score-pill {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 14px;
            padding: 8px 14px; font-size: 15px; font-weight: 700;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .revealed-badge {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 4px 10px;
            font-size: 12px; text-shadow: none; display: flex; align-items: center; gap: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); white-space: nowrap; color: #fff;
        }
        @media (min-width: 768px) { .revealed-badge { font-size: 13px; padding: 6px 12px; } }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<div class="app-container">
    
    <div id="view-login" class="view-centered" style="margin-top: 20vh;">
        <h1>ioGame</h1>
        <div class="subtitle">Family Game Night 🎲</div>
        <div class="glass-card">
            <input type="text" id="userName" placeholder="Enter Your Nickname" maxlength="12">
            <button class="btn-primary" onclick="joinGame()">Enter Lobby</button>
        </div>
    </div>

    <div id="view-lobby" class="view-centered-wide hidden" style="margin-top: 10vh;">
        <div class="glass-card" style="margin-bottom: 15px;">
            <p style="font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-align: center;">🔗 Invite Friends & Family</p>
            <div class="link-display-container">
                <input type="text" id="lobbyLinkInput" readonly value="">
                <button class="btn-accent" style="width: auto; padding: 0 20px; font-size: 14px;" onclick="copyInviteLink(this)">Copy</button>
            </div>
        </div>
        
        <div class="glass-card">
            <div id="lobbyEmojiDisplay" class="emoji-row" style="animation: float 3s infinite;"></div>
            <h2 id="lobbyStatusText" style="font-size: 18px; margin-bottom: 20px; text-align: center;">Waiting in Lobby...</h2>
            <div class="player-grid" id="lobbyPlayers"></div>
            
            <button id="btnStartGame" class="btn-disabled" onclick="hostStartGame()">Waiting for Host...</button>
            <button class="btn-danger" style="margin-top: 12px;" onclick="leaveRoom()">Leave Room</button>
        </div>
    </div>

    <div id="view-game" class="hidden">
        <div class="game-wrapper">
            
            <div id="game-content-split" class="game-content-split hidden">
                
                <div class="board-section" id="zone-circular-board">
                    <div id="player-nodes-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
                    
                    <div id="center-glass-orb" class="center-orb">
                        <div id="center-countdown" class="countdown-view hidden">
                            <p style="font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 2px; text-transform: uppercase;">Your Fruit</p>
                            <div id="bigEmoji" style="font-size: 55px; line-height: 1.1; text-shadow: 0 5px 15px rgba(0,0,0,0.3);">❓</div>
                            <div id="countdownDisplay" style="font-size: 18px; font-weight: 900; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); margin-top:5px;">5...</div>
                        </div>

                        <div id="center-transition" class="countdown-view hidden">
                            <p style="font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 5px; text-transform: uppercase;">Next Turn</p>
                            <div id="transitionPlayerName" style="font-size: 26px; font-weight: 900; color: var(--accent); text-shadow: none; text-transform: uppercase;">Player</div>
                        </div>

                        <div id="center-playing" class="countdown-view hidden">
                            <p style="font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 5px; text-transform: uppercase;">Current Target</p>
                            <div id="playingTargetName" style="font-size: 24px; font-weight: 900; color: var(--accent); text-shadow: none; text-transform: uppercase; text-align: center; line-height: 1.1;">Name</div>
                        </div>

                        <div id="center-results" class="countdown-view hidden">
                            <p style="font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 5px; text-transform: uppercase;">Target's Fruit</p>
                            <div id="revealedFruit" style="font-size: 55px; line-height: 1.1; text-shadow: 0 5px 15px rgba(0,0,0,0.3);">❓</div>
                            <div id="revealedText" style="font-size: 15px; font-weight: 900; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); margin-top:5px;">Scores Updated!</div>
                        </div>
                    </div>
                </div>

                <div class="chat-section" id="chat-panel-container">
                    
                    <!-- REVEALED FRUITS IN CHAT TOP -->
                    <div id="revealed-list-container" class="hidden" style="background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-bottom: 1px solid var(--glass-border); z-index: 10;">
                        <div id="revealed-badges" style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;"></div>
                    </div>

                    <div id="center-chat" class="chat-scroll"></div>
                    
                    <!-- DYNAMIC GAME ACTION AREA (Replaces chat input during Q&A) -->
                    <div id="qna-action-area" class="chat-input-area hidden" style="background: rgba(0, 122, 255, 0.15); border-top: none; padding-top: 16px; position: relative; z-index: 20;">
                        
                        <!-- DYNAMIC TIMELINE PROGRESS BAR -->
                        <div id="qna-timer-bar" style="position: absolute; top: 0; left: 0; height: 4px; background: var(--success); width: 100%; transition: width 0.1s linear, background-color 0.3s ease; border-top-left-radius: 12px; border-top-right-radius: 12px;"></div>

                        <div id="qna-action-status" style="font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 8px; text-shadow: 0 1px 3px rgba(0,0,0,0.5);"></div>
                        
                        <!-- Input for Ask/Answer -->
                        <div id="qna-action-input-wrap" class="hidden" style="display: flex; gap: 8px;">
                            <input type="text" id="qnaActionInput" placeholder="..." autocomplete="off" style="margin-bottom: 0; background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.2);">
                            <button id="btnQnaActionSubmit" class="btn-accent" style="width: auto; padding: 12px 18px;">Send</button>
                        </div>

                        <!-- Buttons for Voting -->
                        <div id="qna-action-vote-wrap" class="hidden" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;"></div>
                    </div>

                    <!-- STANDARD CHAT INPUT AREA -->
                    <div id="standard-chat-input-area" class="chat-input-area">
                        <div id="reply-indicator" class="hidden" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; margin-bottom: 10px; border-radius: 12px; display:flex; justify-content:space-between; align-items:center; font-size: 12px; text-shadow: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                            <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:85%;">
                                <b id="reply-user"></b><br>
                                <span id="reply-text" style="color:rgba(255,255,255,0.85);"></span>
                            </div>
                            <button onclick="clearReply()" style="background:rgba(255,255,255,0.2); border-radius:50%; border:none; color:white; width:24px; height:24px; display:flex; align-items:center; justify-content:center; padding:0; font-size:16px; text-shadow:none; cursor:pointer; transition: 0.2s;">×</button>
                        </div>

                        <div style="display: flex; gap: 8px;">
                            <textarea id="chatInput" placeholder="Message..." autocomplete="off"></textarea>
                            <button class="btn-primary" style="width: auto;" onclick="sendChatMessage()">Send</button>
                        </div>
                    </div>
                </div>

            </div>

            <div id="zone-result" class="view-centered-wide hidden" style="margin-top: 10vh; animation: popIn 0.5s ease;">
                <div style="text-align: center;">
                    <div id="resultEmoji" style="font-size: 70px; margin-bottom: 10px; animation: float 2s infinite;">🎉</div>
                    <div id="resultText" style="margin-bottom: 20px; font-size: 24px; font-weight: 800; line-height: 1.2;"></div>
                    
                    <div id="end-controls">
                        <button id="btnPlayAgain" class="btn-primary" onclick="hostStartGame()">Play Again</button>
                        <button class="btn-danger" style="margin-top: 12px;" onclick="leaveRoom()">Leave Room</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, onDisconnect, push, remove, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    // Initialize Firebase from provided configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAVREmzFgrnE_1NP9Ke-Ybtynls1Ka-HNk",
        authDomain: "iogame-145c9.firebaseapp.com",
        databaseURL: "https://iogame-145c9-default-rtdb.firebaseio.com",
        projectId: "iogame-145c9",
        storageBucket: "iogame-145c9.firebasestorage.app",
        messagingSenderId: "1024963573565",
        appId: "1:1024963573565:web:907f671f3fad2c56443754"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let roomId = new URLSearchParams(window.location.search).get('room');
    if (!roomId) {
        roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        try {
            const url = new URL(window.location.href);
            url.searchParams.set('room', roomId);
            window.history.replaceState({path:url.href}, '', url.href);
        } catch (e) {
            console.warn("Cannot rewrite URL in this sandboxed environment. Using memory roomId.");
        }
    }
    
    // Auto-fill previous name
    const storedSessionData = sessionStorage.getItem(`iogame_user_${roomId}`);
    if (storedSessionData) {
        try {
            const parsedSession = JSON.parse(storedSessionData);
            if (parsedSession && parsedSession.name) {
                document.getElementById('userName').value = parsedSession.name;
            }
        } catch(e) {}
    }

    const items = [ {e:"🍎", n:"Apple"}, {e:"🥭", n:"Mango"}, {e:"🍉", n:"Watermelon"}, {e:"🍇", n:"Grapes"}, {e:"🍓", n:"Strawberry"}, {e:"🍊", n:"Orange"} ];
    document.getElementById('lobbyEmojiDisplay').innerHTML = items.map(i => `<span>${i.e}</span>`).join('');

    let myKey = null, myName = "", amIHost = false, globalPlayers = {}, gameState = { phase: 'login', votes: {}, scores: {}, turnOrder: [], turnIndex: 0, qna: {}, revealedFruits: {} };
    let lastPhase = '', lastChatCount = 0, activeReply = null; 
    
    // Professional Stability Master Variables
    let skipTimers = {}; 
    let hostTimerIds = { main: null, countdown: null }; 
    let uiTimerInterval = null;
    let hostQnaTimer = null;

    // Sound FX
    let musicPlaying = false;
    const bgm = document.getElementById('bgMusic'); bgm.volume = 0.15; 
    const sfx = {
        pop: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'), circlePop: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'), 
        vote: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'), send: new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3'),     
        receive: new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3'), start: new Audio('https://assets.mixkit.co/active_storage/sfx/2586/2586-preview.mp3'), 
        win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'), cheer: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
        tick: new Audio('https://assets.mixkit.co/active_storage/sfx/2574/2574-preview.mp3'), alert: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
    };
    Object.values(sfx).forEach(sound => sound.volume = 0.6);
    const playSfx = (sound) => { if(sound) { const c = sound.cloneNode(); c.volume = sound.volume; c.play().catch(()=>{}); } };

    window.toggleMusic = function() {
        playSfx(sfx.pop); 
        if (musicPlaying) { bgm.pause(); } 
        else { bgm.play().catch(()=>{}); }
        musicPlaying = !musicPlaying;
    }

    function getUserColorByName(name) {
        const keys = Object.keys(globalPlayers);
        const index = keys.findIndex(k => globalPlayers[k].name === name);
        if (index === -1) { let h = 0; for(let i=0; i<name.length; i++) h=name.charCodeAt(i)+((h<<5)-h); return `hsl(${Math.abs(h)%360}, 85%, 65%)`; }
        return `hsl(${index * (360 / keys.length)}, 85%, 65%)`;
    }

    window.copyInviteLink = function(btn) { 
        const linkInput = document.getElementById('lobbyLinkInput'); linkInput.select(); navigator.clipboard.writeText(linkInput.value); 
        playSfx(sfx.pop); const originalText = btn.innerText; btn.innerText = "Copied!"; btn.style.background = "var(--success)";
        setTimeout(() => { btn.innerText = originalText; btn.style.background = "var(--accent)"; }, 1500);
    }

    function switchView(viewId) {
        ['view-login', 'view-lobby', 'view-game'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
        if(viewId === 'view-game') setTimeout(() => renderBoardNodes(false), 100); 
    }

    window.leaveRoom = function() { 
        playSfx(sfx.pop); 
        sessionStorage.removeItem(`iogame_user_${roomId}`);
        if (myKey) {
            remove(ref(db, `rooms/${roomId}/players/${myKey}`)).then(() => window.location.reload());
        } else {
            window.location.reload();
        }
    }

    function createConfetti() {
        const colors = ['#FF3B30', '#34C759', '#007AFF', '#FFD700', '#FF9500', '#AF52DE'];
        for (let i = 0; i < 80; i++) {
            let conf = document.createElement('div'); conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw'; conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 2 + 2) + 's'; conf.style.animationDelay = (Math.random() * 0.5) + 's';
            document.body.appendChild(conf); setTimeout(() => conf.remove(), 5000); 
        }
    }

    window.joinGame = function() {
        let rawName = document.getElementById('userName').value.trim(); 
        if(!rawName) return;
        
        myName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
        playSfx(sfx.pop); if(!musicPlaying) toggleMusic();
        
        // Recover previous identity
        let storedData = sessionStorage.getItem(`iogame_user_${roomId}`);
        let joinedTime = Date.now();
        if (storedData) {
            try {
                let parsed = JSON.parse(storedData);
                if (parsed.name === myName) {
                    myKey = parsed.key;
                    joinedTime = parsed.joinedAt || Date.now();
                } else {
                    myKey = 'user_' + Math.random().toString(36).substr(2, 9);
                }
            } catch(e) { myKey = 'user_' + Math.random().toString(36).substr(2, 9); }
        } else {
            myKey = 'user_' + Math.random().toString(36).substr(2, 9);
        }
        sessionStorage.setItem(`iogame_user_${roomId}`, JSON.stringify({ key: myKey, name: myName, joinedAt: joinedTime }));
        
        let displayUrl = window.location.href;
        try {
            const url = new URL(window.location.href);
            url.searchParams.set('room', roomId);
            displayUrl = url.href;
            if (displayUrl.startsWith('blob:')) throw new Error('blob environment'); 
        } catch(e) {
            displayUrl = `https://play-iogame.com/?room=${roomId}`; 
        }
        document.getElementById('lobbyLinkInput').value = displayUrl;
        
        // PROFESSIONAL CONNECTION STABILITY SYSTEM
        if (!window.connectionListenerAdded) {
            window.connectionListenerAdded = true;
            onValue(ref(db, ".info/connected"), (snap) => {
                if (snap.val() === true && myKey) {
                    const playerRef = ref(db, `rooms/${roomId}/players/${myKey}`);
                    const onlineRef = ref(db, `rooms/${roomId}/players/${myKey}/online`);
                    
                    onDisconnect(playerRef).cancel(); // Ensure hard remove is disabled
                    onDisconnect(onlineRef).set(false).then(() => {
                        update(playerRef, { name: myName, joinedAt: joinedTime, online: true });
                    });
                }
            });
        }

        onValue(ref(db, `rooms/${roomId}/players`), (snap) => {
            globalPlayers = snap.val() || {};
            const pKeys = Object.keys(globalPlayers);
            
            let wasIHost = amIHost;

            // Only assign host to a currently online player
            const onlineKeys = pKeys.filter(k => globalPlayers[k].online !== false);
            if (onlineKeys.length > 0) {
                const oldestKey = onlineKeys.sort((a,b) => globalPlayers[a].joinedAt - globalPlayers[b].joinedAt)[0];
                amIHost = (oldestKey === myKey);
            } else {
                amIHost = false;
            }
            
            renderLobby();
            if(gameState.phase !== 'login' && gameState.phase !== 'lobby') {
                renderBoardNodes(false); 
            }
            
            // HOST MIGRATION RECOVERY
            if (!wasIHost && amIHost) { 
                resumeHostDuties();
            }

            if (amIHost && gameState.phase === 'qna') {
                checkTurnResolution();
                checkHostAutoSkip();
            }
        });

        onValue(ref(db, `rooms/${roomId}/state`), (snap) => {
            const s = snap.val();
            if (s) {
                gameState = { 
                    phase: s.phase || 'login', 
                    countdown: s.countdown || 0,
                    playerItems: s.playerItems || {},
                    votes: s.votes || {}, 
                    scores: s.scores || {}, 
                    turnOrder: s.turnOrder || [],
                    turnIndex: s.turnIndex || 0,
                    nextTargetName: s.nextTargetName || '',
                    lastTargetFruit: s.lastTargetFruit || '',
                    qna: s.qna || {},
                    revealedFruits: s.revealedFruits || {}
                };
                handleGameState(gameState);
                
                if (amIHost && gameState.phase === 'qna') {
                    checkTurnResolution();
                    checkHostAutoSkip();
                }
            }
        });

        onValue(ref(db, `rooms/${roomId}/chat`), (snap) => {
            const chats = snap.val() || {};
            renderChat(Object.values(chats));
        });

        switchView('view-lobby'); setupSwipeToReply();
    }

    function updateState(updates) {
        return update(ref(db, `rooms/${roomId}/state`), updates);
    }

    function sendSystemMessage(msg) {
        push(ref(db, `rooms/${roomId}/chat`), { u: 'System', m: msg });
    }

    // Host Migration Duty Transfer System
    function resumeHostDuties() {
        if (!amIHost) return;
        clearTimeout(hostTimerIds.main);
        clearInterval(hostTimerIds.countdown);
        
        // Recover lost background timers on migration
        if (gameState.phase === 'countdown') {
            window.startCountdown();
        } else if (gameState.phase === 'readingResults') {
            hostTimerIds.main = setTimeout(window.executeTurnTransition, 3000); 
        } else if (gameState.phase === 'turnTransition') {
            hostTimerIds.main = setTimeout(window.startTurn, 1500); 
        } else if (gameState.phase === 'qna') {
            checkTurnResolution();
            checkHostAutoSkip();
        }
    }

    function renderLobby() {
        const grid = document.getElementById('lobbyPlayers'); grid.innerHTML = "";
        const keys = Object.keys(globalPlayers);
        
        const onlineKeys = keys.filter(k => globalPlayers[k].online !== false);
        const hostKey = onlineKeys.length > 0 ? onlineKeys.sort((a,b) => globalPlayers[a].joinedAt - globalPlayers[b].joinedAt)[0] : null;

        keys.forEach(id => {
            const isOffline = globalPlayers[id].online === false;
            const style = isOffline ? 'opacity: 0.5;' : '';
            grid.innerHTML += `<div class="p-badge" style="${style}">${globalPlayers[id].name} ${id === hostKey ? '👑' : ''}</div>`;
        });
        
        playSfx(sfx.pop); 
        const btnStart = document.getElementById('btnStartGame');
        const statusText = document.getElementById('lobbyStatusText');

        if (amIHost) {
            statusText.innerText = "You are the Host! 👑";
            btnStart.className = "btn-primary"; btnStart.innerText = "Start Game"; 
            btnStart.disabled = false;
        } else {
            statusText.innerText = "Waiting for Host to start...";
            btnStart.className = "btn-disabled"; btnStart.innerText = "Waiting for Host..."; 
            btnStart.disabled = true;
        }
    }

    window.hostStartGame = function() {
        if (!amIHost) return;
        playSfx(sfx.start); clearReply();
        const keys = Object.keys(globalPlayers);
        let shuffledItems = [...items].sort(() => 0.5 - Math.random());
        let playerItems = {}, initScores = {};
        keys.forEach((k, i) => { playerItems[k] = shuffledItems[i % shuffledItems.length]; initScores[k] = 0; });
        
        sendSystemMessage(`🍎 Game started! Memorize your secret fruit.`);

        updateState({ 
            phase: 'countdown', 
            playerItems: playerItems, 
            countdown: 5, 
            votes: null, 
            scores: initScores, 
            turnOrder: keys, 
            turnIndex: 0,
            qna: null,
            revealedFruits: {}
        });
    }

    window.startCountdown = function() {
        if (!amIHost) return;
        clearInterval(hostTimerIds.countdown);
        let timer = gameState.countdown || 5;
        hostTimerIds.countdown = setInterval(() => {
            timer--;
            if (timer > 0) { 
                playSfx(sfx.tick); 
                updateState({ countdown: timer }); 
            } else { 
                clearInterval(hostTimerIds.countdown); 
                playSfx(sfx.pop); 
                window.startTurn(); 
            }
        }, 1000);
    }

    window.startTurn = function() {
        if (!amIHost || (gameState.phase !== 'turnTransition' && gameState.phase !== 'countdown')) return;
        get(ref(db, `rooms/${roomId}/state`)).then(snap => {
            const s = snap.val();
            if(!s || !s.turnOrder) return;
            const targetId = s.turnOrder[s.turnIndex];
            const targetName = globalPlayers[targetId] ? globalPlayers[targetId].name : 'Someone';
            
            sendSystemMessage(`🔴 Target Acquired: ${targetName}! The interrogation begins.`);
            
            // Exclude offline players from being askers
            const askers = s.turnOrder.filter(id => id !== targetId && globalPlayers[id] && globalPlayers[id].online !== false);
            if (askers.length > 0) {
                updateState({ 
                    phase: 'qna', 
                    votes: null,
                    qna: { askers: askers, currentIndex: 0, status: 'ask', currentQuestion: '', deadline: Date.now() + 30000 }
                });
            } else {
                updateState({ phase: 'readingResults', lastTargetFruit: s.playerItems[targetId]?.e || '❓', scores: s.scores || {} });
            }
        });
    }

    window.executeTurnTransition = function() {
        if (!amIHost || gameState.phase !== 'readingResults') return;
        const s = gameState;
        let nextIndex = s.turnIndex + 1;
        
        // Skip over disconnected players so the game doesn't stall
        while (nextIndex < s.turnOrder.length && (!globalPlayers[s.turnOrder[nextIndex]] || globalPlayers[s.turnOrder[nextIndex]].online === false)) { 
            nextIndex++; 
        }

        if (nextIndex >= s.turnOrder.length) {
            updateState({ phase: 'finished' });
        } else {
            const nextTargetName = globalPlayers[s.turnOrder[nextIndex]] ? globalPlayers[s.turnOrder[nextIndex]].name : 'Player';
            updateState({ 
                phase: 'turnTransition', 
                turnIndex: nextIndex,
                nextTargetName: nextTargetName
            });
        }
    }

    function renderChat(chatValues) {
        const chatBox = document.getElementById('center-chat');
        chatBox.innerHTML = "";
        chatValues.forEach(msg => {
            if (msg.u === 'System') { chatBox.innerHTML += `<div class="chat-msg chat-system">${msg.m}</div>`; } 
            else {
                const pColor = getUserColorByName(msg.u);
                const align = (msg.u === myName) ? 'margin-left: auto; border-bottom-right-radius: 4px;' : 'margin-right: auto; border-bottom-left-radius: 4px;';
                const bgStyle = `background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); border-left: 4px solid ${pColor};`;
                
                let quoteHtml = '';
                if (msg.replyTo) {
                    const repCol = getUserColorByName(msg.replyTo.u);
                    quoteHtml = `<div class="chat-reply-quote" style="border-left-color: ${repCol};"><b style="color: ${repCol};">${msg.replyTo.u}</b>: ${msg.replyTo.m}</div>`;
                }
                
                chatBox.innerHTML += `<div class="chat-msg" style="${align} ${bgStyle}" data-u="${msg.u}" data-m="${msg.m}">${quoteHtml}<b style="color: ${pColor}; font-size: 11px;">${msg.u}</b><br><span style="color: var(--text-main);">${msg.m}</span></div>`;
            }
        });
        setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);

        if (chatValues.length > lastChatCount) {
            const lastMsg = chatValues[chatValues.length - 1];
            if (lastMsg.u !== myName && lastMsg.u !== 'System' && lastChatCount !== 0) playSfx(sfx.receive);
        }
        lastChatCount = chatValues.length;
    }

    function handleGameState(state) {
        const isNewPhase = state.phase !== lastPhase;
        switchView('view-game');
        
        const splitView = document.getElementById('game-content-split');
        const resultView = document.getElementById('zone-result');

        if (state.phase !== 'finished') {
            splitView.classList.remove('hidden');
            resultView.classList.add('hidden');
        }

        ['center-countdown', 'center-transition', 'center-playing', 'center-results'].forEach(id => document.getElementById(id).classList.add('hidden'));

        if (state.phase === 'countdown') {
            document.getElementById('center-countdown').classList.remove('hidden');
            if(state.playerItems && state.playerItems[myKey]) document.getElementById('bigEmoji').innerText = state.playerItems[myKey].e;
            document.getElementById('countdownDisplay').innerText = `Starts in ${state.countdown}...`;
            renderQnAUI(); 
            renderBoardNodes(isNewPhase); 
        }

        if (state.phase === 'qna') {
            document.getElementById('center-playing').classList.remove('hidden');
            
            const curTargetId = state.turnOrder[state.turnIndex];
            const currentTargetData = globalPlayers[curTargetId] || { name: 'Player' };
            
            const qna = state.qna;
            let orbHTML = currentTargetData.name;
            if (qna && qna.askers && qna.askers[qna.currentIndex]) {
                const aName = globalPlayers[qna.askers[qna.currentIndex]]?.name || 'Player';
                orbHTML += `<br><span style="font-size: 14px; color: var(--text-muted); font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Asker: ${aName}</span>`;
            }
            document.getElementById('playingTargetName').innerHTML = orbHTML;
            
            renderQnAUI();
            renderBoardNodes(isNewPhase); 
        }

        if (state.phase === 'readingResults') {
            document.getElementById('center-results').classList.remove('hidden');
            document.getElementById('revealedFruit').innerText = state.lastTargetFruit || '❓';
            renderQnAUI(); 
            renderBoardNodes(isNewPhase); 
        }

        if (state.phase === 'turnTransition') {
            document.getElementById('center-transition').classList.remove('hidden');
            document.getElementById('transitionPlayerName').innerText = state.nextTargetName;
            renderQnAUI(); 
            renderBoardNodes(isNewPhase); 
        }

        if (state.phase === 'finished') {
            splitView.classList.add('hidden'); resultView.classList.remove('hidden');
            
            const sortedPlayers = Object.keys(globalPlayers).sort((a, b) => (state.scores[b] || 0) - (state.scores[a] || 0));
            const winners = sortedPlayers.filter(p => (state.scores[p] || 0) === (state.scores[sortedPlayers[0]] || 0)).map(p => globalPlayers[p].name);
            let chartHtml = `<div style="text-align:left; background:rgba(255, 255, 255, 0.15); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border: 1px solid var(--glass-border); padding:15px; border-radius:16px; margin-bottom:20px; font-size:15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-shadow: none;">`;
            sortedPlayers.forEach((p, i) => { 
                const isLast = i === sortedPlayers.length - 1;
                const borderStyle = isLast ? '' : 'border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:8px; padding-bottom:8px;';
                chartHtml += `<div style="display:flex; justify-content:space-between; ${borderStyle}"><span><b>#${i+1}</b> ${globalPlayers[p].name}</span><span style="color:var(--success); font-weight:bold;">${state.scores[p] || 0} pts</span></div>`; 
            });
            
            document.getElementById('resultText').innerHTML = `<div style="font-size: 38px; font-weight: 900; color: #FFD700; text-shadow: 0 0 25px rgba(255,215,0,0.6); margin-bottom: 5px;">${winners.join(' & ')}</div><div style="font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: 2px; margin-bottom: 20px;">WINNER!</div>${chartHtml}</div>`;
            
            const btnPlayAgain = document.getElementById('btnPlayAgain');
            if (amIHost) { 
                btnPlayAgain.className = "btn-primary"; btnPlayAgain.innerText = "Play Again"; btnPlayAgain.disabled = false;
            } else { 
                btnPlayAgain.className = "btn-disabled"; btnPlayAgain.innerText = "Waiting for Host..."; btnPlayAgain.disabled = true;
            }
            if (lastPhase !== 'finished') { playSfx(sfx.win); playSfx(sfx.cheer); createConfetti(); }
        }
        
        // Host Action centralized Timers for stable synchronization
        if (amIHost) {
            clearInterval(hostQnaTimer);
            if (state.phase === 'qna') {
                hostQnaTimer = setInterval(checkHostAutoSkip, 1000);
            }
            if (isNewPhase) {
                clearTimeout(hostTimerIds.main);
                clearInterval(hostTimerIds.countdown);
                if (state.phase === 'countdown') {
                    window.startCountdown();
                } else if (state.phase === 'readingResults') {
                    hostTimerIds.main = setTimeout(window.executeTurnTransition, 4500);
                } else if (state.phase === 'turnTransition') {
                    hostTimerIds.main = setTimeout(window.startTurn, 2500);
                }
            }
        }

        // Timeline UI Update Loop
        clearInterval(uiTimerInterval);
        if (state.phase === 'qna') {
            uiTimerInterval = setInterval(updateTimelineUI, 100);
        }

        renderRevealedFruits();
        if (isNewPhase && lastPhase !== '') playSfx(sfx.circlePop);
        lastPhase = state.phase;
    }

    function updateTimelineUI() {
        const bar = document.getElementById('qna-timer-bar');
        if (!bar || gameState.phase !== 'qna' || !gameState.qna || !gameState.qna.deadline) return;

        const now = Date.now();
        let timeLeft = gameState.qna.deadline - now;
        if (timeLeft < 0) timeLeft = 0;
        
        let totalTime = (gameState.qna.status === 'vote') ? 15000 : 30000;
        let pct = (timeLeft / totalTime) * 100;
        bar.style.width = pct + '%';

        if (pct > 50) {
            bar.style.backgroundColor = 'var(--success)';
        } else if (pct > 20) {
            bar.style.backgroundColor = '#FFD700'; // Yellow
        } else {
            bar.style.backgroundColor = 'var(--primary)'; // Red
        }
    }

    function renderQnAUI() {
        const actionArea = document.getElementById('qna-action-area');
        const standardChat = document.getElementById('standard-chat-input-area');
        
        if (gameState.phase !== 'qna') {
            actionArea.classList.add('hidden');
            standardChat.classList.remove('hidden');
            return;
        }

        const qna = gameState.qna;
        if (!qna || !qna.askers || qna.status === 'resolving') {
            actionArea.classList.add('hidden');
            standardChat.classList.remove('hidden');
            return;
        }

        const targetId = gameState.turnOrder[gameState.turnIndex];
        const askerId = qna.askers[qna.currentIndex];
        const targetName = globalPlayers[targetId]?.name || 'Target';
        const askerName = globalPlayers[askerId]?.name || 'Player';

        const statusEl = document.getElementById('qna-action-status');
        const inputWrap = document.getElementById('qna-action-input-wrap');
        const voteWrap = document.getElementById('qna-action-vote-wrap');
        const actionInput = document.getElementById('qnaActionInput');
        const btnSubmit = document.getElementById('btnQnaActionSubmit');

        // Reset to safely start
        actionArea.classList.add('hidden');
        standardChat.classList.remove('hidden');
        inputWrap.classList.add('hidden');
        voteWrap.classList.add('hidden');
        btnSubmit.onclick = null;

        if (qna.status === 'ask') {
            if (myKey === askerId) {
                actionArea.classList.remove('hidden');
                standardChat.classList.add('hidden');
                inputWrap.classList.remove('hidden');
                statusEl.innerHTML = `🗣️ Your turn to ask ${targetName} a question:`;
                actionInput.placeholder = `Ask your question...`;
                btnSubmit.onclick = () => {
                    const text = actionInput.value.trim();
                    if (!text) return;
                    updateState({ 'qna/status': 'answer', 'qna/currentQuestion': text, 'qna/deadline': Date.now() + 30000 });
                    actionInput.value = '';
                };
            }
        } else if (qna.status === 'answer') {
            if (myKey === targetId) {
                actionArea.classList.remove('hidden');
                standardChat.classList.add('hidden');
                inputWrap.classList.remove('hidden');
                statusEl.innerHTML = `💬 ${askerName} asked: <span style="font-weight:normal;">"${qna.currentQuestion}"</span>`;
                actionInput.placeholder = `Answer ${askerName}...`;
                btnSubmit.onclick = () => {
                    const text = actionInput.value.trim();
                    if (!text) return;
                    push(ref(db, `rooms/${roomId}/chat`), { u: 'System', m: `💬 ${askerName}: ${qna.currentQuestion}\n🗣️ ${targetName}: ${text}` });
                    updateState({ 'qna/status': 'vote', 'qna/deadline': Date.now() + 15000 });
                    actionInput.value = '';
                };
            }
        } else if (qna.status === 'vote') {
            if (myKey === askerId) {
                actionArea.classList.remove('hidden');
                standardChat.classList.add('hidden');
                voteWrap.classList.remove('hidden');
                statusEl.innerHTML = `🎯 Based on the answer, guess ${targetName}'s fruit!`;
                
                // Render fruit buttons directly in chat action area
                voteWrap.innerHTML = items.map(i => `<div class="fruit-btn" style="background:rgba(255,255,255,0.2);" onclick="submitSequentialVote('${i.e}')">${i.e}</div>`).join('');
            }
        }
    }

    document.getElementById("qnaActionInput").addEventListener("keypress", function(e) { 
        if (e.key === "Enter") { 
            e.preventDefault(); 
            const btn = document.getElementById('btnQnaActionSubmit');
            if (btn.onclick) btn.onclick();
        } 
    });

    window.submitSequentialVote = function(fruit) {
        if (gameState.phase !== 'qna' || gameState.qna.status !== 'vote') return;
        playSfx(sfx.pop); 
        
        set(ref(db, `rooms/${roomId}/state/votes/${myKey}`), fruit).then(() => {
            sendSystemMessage(`${myName} locked in their guess! ✅`);
            
            const qna = gameState.qna;
            const nextIndex = qna.currentIndex + 1;
            
            if (nextIndex < qna.askers.length) {
                updateState({ 'qna/status': 'ask', 'qna/currentIndex': nextIndex, 'qna/currentQuestion': '', 'qna/deadline': Date.now() + 30000 });
            } else {
                updateState({ 'qna/status': 'resolving' }); 
            }
        });
    }

    function checkHostAutoSkip() {
        if (!amIHost || gameState.phase !== 'qna') return;
        const qna = gameState.qna;
        if (!qna || !qna.askers || qna.status === 'resolving') return;
        
        const targetId = gameState.turnOrder[gameState.turnIndex];
        const askerId = qna.askers[qna.currentIndex];
        
        const now = Date.now();
        const isTimeUp = qna.deadline && now >= qna.deadline;

        // Auto-skip logic based on TIMEOUT
        if (isTimeUp) {
            if (qna.status === 'ask') {
                set(ref(db, `rooms/${roomId}/state/votes/${askerId}`), 'Skipped');
                const nextIndex = qna.currentIndex + 1;
                if (nextIndex < qna.askers.length) {
                    updateState({ 'qna/status': 'ask', 'qna/currentIndex': nextIndex, 'qna/currentQuestion': '', 'qna/deadline': now + 30000 });
                } else {
                    updateState({ 'qna/status': 'resolving' });
                }
            } else if (qna.status === 'answer') {
                push(ref(db, `rooms/${roomId}/chat`), { u: 'System', m: `⏳ Time's up for ${globalPlayers[targetId]?.name || 'Target'} to answer!` });
                updateState({ 'qna/status': 'vote', 'qna/deadline': now + 15000 });
            } else if (qna.status === 'vote') {
                set(ref(db, `rooms/${roomId}/state/votes/${askerId}`), 'Skipped');
                const nextIndex = qna.currentIndex + 1;
                if (nextIndex < qna.askers.length) {
                    updateState({ 'qna/status': 'ask', 'qna/currentIndex': nextIndex, 'qna/currentQuestion': '', 'qna/deadline': now + 30000 });
                } else {
                    updateState({ 'qna/status': 'resolving' });
                }
            }
            return; // Exit early if time is up, skip offline checks below
        }

        // Target Offline = Grace period of 5s before skipping everyone else
        if (!globalPlayers[targetId] || globalPlayers[targetId].online === false) {
            if (!skipTimers[targetId]) {
                skipTimers[targetId] = setTimeout(() => {
                    let missingVotes = {};
                    qna.askers.forEach(id => {
                        if(!gameState.votes || !gameState.votes[id]) missingVotes[id] = 'Skipped';
                    });
                    if(Object.keys(missingVotes).length > 0) update(ref(db, `rooms/${roomId}/state/votes`), missingVotes);
                    updateState({ 'qna/status': 'resolving' });
                }, 5000);
            }
        } else {
            if (skipTimers[targetId]) { clearTimeout(skipTimers[targetId]); skipTimers[targetId] = null; }
        }

        // Asker Offline = Auto-Skip them after a 5s grace period
        if ((!globalPlayers[askerId] || globalPlayers[askerId].online === false) && (qna.status === 'ask' || qna.status === 'vote')) {
            if (!skipTimers[askerId]) {
                skipTimers[askerId] = setTimeout(() => {
                    set(ref(db, `rooms/${roomId}/state/votes/${askerId}`), 'Skipped');
                    const nextIndex = qna.currentIndex + 1;
                    if (nextIndex < qna.askers.length) {
                        updateState({ 'qna/status': 'ask', 'qna/currentIndex': nextIndex, 'qna/currentQuestion': '', 'qna/deadline': Date.now() + 30000 });
                    } else {
                        updateState({ 'qna/status': 'resolving' });
                    }
                }, 5000);
            }
        } else {
            if (skipTimers[askerId]) { clearTimeout(skipTimers[askerId]); skipTimers[askerId] = null; }
        }
    }

    function checkTurnResolution() {
        if (!amIHost || gameState.phase !== 'qna') return;
        
        const qna = gameState.qna;
        if (!qna || !qna.askers) return;

        const s = gameState;
        // The game logically only cares about askers who successfully joined the turn order
        const requiredAskers = qna.askers;
        const allVoted = requiredAskers.every(id => s.votes && s.votes[id]);
        
        if (qna.status === 'resolving' || allVoted) {
            const targetId = s.turnOrder[s.turnIndex];
            const targetFruit = s.playerItems[targetId] ? s.playerItems[targetId].e : '❓';

            let correct = [];
            let newScores = { ...(s.scores || {}) };
            
            for(let [pid, vote] of Object.entries(s.votes || {})) {
                if(vote === targetFruit) { 
                    newScores[pid] = (newScores[pid] || 0) + 10; 
                    if (globalPlayers[pid]) correct.push(globalPlayers[pid].name); 
                }
            }
            
            const targetName = globalPlayers[targetId] ? globalPlayers[targetId].name : 'Offline Target';
            sendSystemMessage(`Target ${targetName} had ${targetFruit}! ` + (correct.length > 0 ? `${correct.join(', ')} guessed correctly (+10)!` : `Nobody guessed correctly (0 pts)!`));
            
            let newRevealed = { ...(s.revealedFruits || {}) };
            newRevealed[targetId] = targetFruit;

            // Atomic Resolution (The handleGameState func will catch this and boot the transition timers automatically)
            gameState.phase = 'readingResults';
            updateState({ 
                phase: 'readingResults', 
                lastTargetFruit: targetFruit,
                scores: newScores,
                revealedFruits: newRevealed,
                qna: null
            });
            
            playSfx(sfx.alert);
        }
    }

    function renderBoardNodes(isNewPhase = false) {
        const board = document.getElementById('zone-circular-board');
        if(!board || board.offsetParent === null) return; 
        
        const nodesContainer = document.getElementById('player-nodes-container');
        
        // Merge current active players and anyone who was in the turn order so nobody visually disappears
        let activeKeys = Object.keys(globalPlayers);
        if (gameState.phase !== 'login' && gameState.phase !== 'lobby' && gameState.turnOrder) {
            activeKeys = Array.from(new Set([...activeKeys, ...gameState.turnOrder]));
        }
        
        const keys = activeKeys;
        const N = keys.length;
        if (N === 0) return;

        const angleStep = (Math.PI * 2) / N;
        let startAngle = -Math.PI / 2; 
        if (N === 2) startAngle = Math.PI;
        else if (N === 4) startAngle = -Math.PI / 4; 

        const minDimension = Math.min(board.clientWidth, board.clientHeight);
        const orbRadius = window.innerWidth >= 1024 ? 130 : (window.innerWidth >= 768 ? 100 : 75);
        const nodeRadiusOffset = window.innerWidth >= 1024 ? 65 : (window.innerWidth >= 768 ? 55 : 42);
        const radius = Math.max(orbRadius + nodeRadiusOffset, (minDimension / 2) - nodeRadiusOffset - 10);

        Array.from(nodesContainer.children).forEach(child => {
            const id = child.id.replace('node-', '');
            if (!keys.includes(id)) child.remove();
        });

        keys.forEach((pid, index) => {
            const angle = startAngle + (index * angleStep);
            
            const pData = globalPlayers[pid] || { name: 'Player' };
            const isOffline = pData.online === false;
            const pColor = getUserColorByName(pData.name);
            
            const currentTurnId = (gameState.turnOrder && gameState.turnOrder.length > gameState.turnIndex) ? gameState.turnOrder[gameState.turnIndex] : null;
            const isActiveTarget = pid === currentTurnId && (gameState.phase === 'qna' || gameState.phase === 'readingResults');
            const hasVoted = gameState.votes && gameState.votes[pid];
            
            let glowClass = isActiveTarget ? 'active-target-glow' : (hasVoted ? 'voted-glow' : '');
            let nodeEl = document.getElementById(`node-${pid}`);
            
            if (!nodeEl) { 
                nodeEl = document.createElement('div'); 
                nodeEl.id = `node-${pid}`; 
                nodesContainer.appendChild(nodeEl); 
                nodeEl.style.animation = 'popInNode 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; 
            }

            if (hasVoted && !nodeEl.classList.contains('voted-glow')) {
                nodeEl.style.animation = 'none'; void nodeEl.offsetWidth; nodeEl.style.animation = 'votePopAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; playSfx(sfx.vote); 
            }

            nodeEl.className = `player-node ${glowClass} ${gameState.phase === 'countdown' ? 'node-blink' : ''}`;
            nodeEl.style.left = `calc(50% + ${Math.cos(angle) * radius}px)`; 
            nodeEl.style.top = `calc(50% + ${Math.sin(angle) * radius}px)`;
            nodeEl.style.borderColor = glowClass ? '' : 'var(--glass-border)';
            // Crucial Stability Enhancement: gracefully gray out players who drop connection instead of deleting them entirely!
            nodeEl.style.opacity = isOffline ? '0.4' : '1';
            nodeEl.style.filter = isOffline ? 'grayscale(100%)' : 'none';
            nodeEl.innerHTML = `<div class="score-badge">${gameState.scores[pid] || 0}</div><div class="node-color" style="background: ${pColor};"></div><div class="node-name">${pData.name}</div>`;
        });
    }

    function renderRevealedFruits() {
        const container = document.getElementById('revealed-list-container');
        if (!gameState.revealedFruits || Object.keys(gameState.revealedFruits).length === 0 || gameState.phase === 'login' || gameState.phase === 'lobby') {
            container.classList.add('hidden');
            return;
        }
        container.classList.remove('hidden');
        
        const badgesHtml = Object.entries(gameState.revealedFruits).map(([pid, fruit]) => {
            const pName = globalPlayers[pid]?.name || 'Offline';
            return `<div class="revealed-badge"><b>${pName}:</b> <span style="font-size: 1.2em; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));">${fruit}</span></div>`;
        }).join('');
        
        document.getElementById('revealed-badges').innerHTML = badgesHtml;
    }

    window.addEventListener('resize', () => {
        if(document.getElementById('zone-circular-board').offsetParent !== null) renderBoardNodes(false); 
    });

    function setupSwipeToReply() {
        const chatBox = document.getElementById('center-chat'); let startX = 0, swipedElem = null;
        const handleStart = (e, isTouch) => { const el = e.target.closest('.chat-msg'); if(!el || el.classList.contains('chat-system')) return; startX = isTouch ? e.touches[0].clientX : e.clientX; swipedElem = el; swipedElem.style.transition = 'none'; };
        const handleMove = (e, isTouch) => { 
            if(!swipedElem) return; 
            const diffX = (isTouch ? e.touches[0].clientX : e.clientX) - startX; 
            const isOwn = swipedElem.getAttribute('data-u') === myName;
            if (isOwn && diffX < 0 && diffX > -80) swipedElem.style.transform = `translateX(${diffX}px)`; 
            else if (!isOwn && diffX > 0 && diffX < 80) swipedElem.style.transform = `translateX(${diffX}px)`; 
        };
        const handleEnd = (e, isTouch) => { 
            if(!swipedElem) return; 
            const diffX = (isTouch ? e.changedTouches[0].clientX : e.clientX) - startX; 
            const isOwn = swipedElem.getAttribute('data-u') === myName;
            swipedElem.style.transition = 'transform 0.2s ease'; swipedElem.style.transform = 'translateX(0)'; 
            if ((isOwn && diffX < -40) || (!isOwn && diffX > 40)) setReply(swipedElem.getAttribute('data-u'), swipedElem.getAttribute('data-m')); 
            swipedElem = null; 
        };

        chatBox.addEventListener('touchstart', e => handleStart(e, true), {passive: true}); chatBox.addEventListener('touchmove', e => handleMove(e, true), {passive: true}); chatBox.addEventListener('touchend', e => handleEnd(e, true));
        chatBox.addEventListener('mousedown', e => handleStart(e, false)); window.addEventListener('mousemove', e => handleMove(e, false)); window.addEventListener('mouseup', e => handleEnd(e, false));
    }

    function setReply(user, msgText) {
        playSfx(sfx.pop); activeReply = { u: user, m: msgText };
        const uColor = getUserColorByName(user);
        
        document.getElementById('reply-user').innerText = `Replying to ${user}`; 
        document.getElementById('reply-user').style.color = uColor;
        document.getElementById('reply-text').innerText = msgText;
        
        const indicator = document.getElementById('reply-indicator');
        indicator.style.borderLeft = `3px solid ${uColor}`;
        indicator.classList.remove('hidden'); 
        
        document.getElementById('chatInput').focus();
    }
    
    window.clearReply = function() { playSfx(sfx.pop); activeReply = null; document.getElementById('reply-indicator').classList.add('hidden'); }

    window.sendChatMessage = function() {
        const input = document.getElementById('chatInput'); if(!input.value.trim()) return; playSfx(sfx.send); 
        const payload = { u: myName, m: input.value.trim() }; if(activeReply) { payload.replyTo = activeReply; clearReply(); }
        push(ref(db, `rooms/${roomId}/chat`), payload);
        input.value = "";
    }
    
    document.getElementById("chatInput").addEventListener("keypress", function(e) { if (e.key === "Enter") { e.preventDefault(); sendChatMessage(); } });
</script>
