<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ioGame - Glass Room Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #FF3B30; --success: #34C759; --bg: #000; --glass: rgba(255, 255, 255, 0.08); }
        body { font-family: -apple-system, sans-serif; background: #050505; color: #fff; margin: 0; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        .container { width: 100%; max-width: 900px; padding: 20px; text-align: center; }
        
        /* Glass Card Layout */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .player-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 15px; transition: 0.4s; position: relative; }
        .player-card.active { border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(255,59,48,0.3); }
        .player-card.blurred { filter: blur(8px); pointer-events: none; opacity: 0.5; }
        
        .badge { font-size: 10px; background: #FFD60A; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; position: absolute; top: 10px; right: 10px; }
        
        /* UI Elements */
        button { border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: #fff; padding: 12px 30px; font-size: 16px; width: 200px; }
        .btn-disabled { background: #333 !important; cursor: not-allowed; opacity: 0.5; }
        .btn-copy { background: rgba(255,255,255,0.1); color: #fff; padding: 8px 15px; font-size: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        .emoji-display { font-size: 40px; margin: 10px 0; display: block; }
        .status-msg { font-size: 14px; color: rgba(255,255,255,0.6); margin: 15px 0; }
        
        #questionBox { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin: 20px 0; border: 1px dashed #555; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen" style="margin-top: 100px;">
        <h1 style="letter-spacing: -2px;">ioGame</h1>
        <input type="text" id="userName" placeholder="Your Name" style="padding:12px; border-radius:10px; background:#111; border:1px solid #333; color:#fff; width:200px; text-align:center;">
        <br><br>
        <button class="btn-main" onclick="joinGame()">Enter Room</button>
    </div>

    <div id="gameBoard" class="hidden">
        <h2 id="roomTitle">Room Lobby</h2>
        <button class="btn-copy" onclick="copyLink()">🔗 Copy & Share Link</button>
        
        <div id="hostArea">
            <button id="startBtn" class="btn-main btn-disabled" onclick="startGame()">START GAME</button>
        </div>

        <div id="statusUpdate" class="status-msg">Waiting for more players...</div>

        <div class="game-grid" id="playerGrid"></div>

        <div id="actionArea" class="hidden">
            <div id="questionBox">
                <p id="instructionText">Waiting for Main Player...</p>
                <div id="decisionButtons" class="hidden">
                    <button class="btn-main" style="background:var(--success)" onclick="setStance('truth')">I'll tell TRUTH</button>
                    <button class="btn-main" onclick="setStance('lie')">I'll tell a LIE</button>
                </div>
                <div id="votingButtons" class="hidden">
                    <button class="btn-main" style="background:var(--success)" onclick="castVote('truth')">Truth</button>
                    <button class="btn-main" onclick="castVote('lie')">Lie</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVREmzFgrnE_1NP9Ke-YbtynlS1Ka-HNk",
        authDomain: "iogame-145c9.firebaseapp.com",
        databaseURL: "https://iogame-145c9-default-rtdb.firebaseio.com",
        projectId: "iogame-145c9",
        storageBucket: "iogame-145c9.firebasestorage.app",
        messagingSenderId: "1024963573565",
        appId: "1:1024963573565:web:907f671f3fad2c56443754",
        measurementId: "G-N1J57G3WS6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let roomId = new URLSearchParams(window.location.search).get('room');
    let myKey, amIHost = false;
    const items = [{e:"🍎", n:"Apple"}, {e:"🚗", n:"Tesla"}, {e:"👟", n:"Nike"}, {e:"🍕", n:"Pizza"}];

    if (!roomId) {
        roomId = Math.random().toString(36).substring(7);
        window.history.pushState({}, '', `?room=${roomId}`);
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied! Share it with your friends.");
    }

    function joinGame() {
        const name = document.getElementById('userName').value.trim();
        if(!name) return;
        const ref = db.ref(`rooms/${roomId}/players`).push();
        myKey = ref.key;
        ref.set({ name: name, joinedAt: firebase.database.ServerValue.TIMESTAMP }).then(setupListeners);
    }

    function setupListeners() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('gameBoard').classList.remove('hidden');

        // Monitor Players
        db.ref(`rooms/${roomId}/players`).on('value', snap => {
            const players = snap.val();
            const keys = Object.keys(players || {});
            amIHost = (myKey === keys[0]);
            
            const grid = document.getElementById('playerGrid');
            grid.innerHTML = "";
            keys.forEach((id, index) => {
                const isHost = (index === 0);
                const isMe = (id === myKey);
                grid.innerHTML += `
                    <div id="card-${id}" class="player-card">
                        ${isHost ? '<span class="badge">HOST</span>' : `<span class="badge" style="background:#555;color:#fff">P${index}</span>`}
                        <div style="font-size:30px; margin-bottom:10px;">👤</div>
                        <div style="font-weight:bold">${players[id].name} ${isMe ? '(You)' : ''}</div>
                        <div id="emoji-${id}" class="emoji-display hidden">❓</div>
                    </div>`;
            });

            const startBtn = document.getElementById('startBtn');
            if(amIHost) {
                startBtn.classList.remove('btn-disabled');
                startBtn.innerText = "START GAME";
            } else {
                startBtn.classList.add('btn-disabled');
                startBtn.innerText = "HOST STARTING...";
            }
        });

        // Monitor Game State
        db.ref(`rooms/${roomId}/gameState`).on('value', snap => {
            const state = snap.val();
            if(!state) return;
            handleGameLogic(state);
        });
    }

    function startGame() {
        if(!amIHost) return;
        db.ref(`rooms/${roomId}/players`).once('value', snap => {
            const keys = Object.keys(snap.val());
            const randomPlayer = keys[Math.floor(Math.random() * keys.length)];
            const randomItem = items[Math.floor(Math.random() * items.length)];
            
            db.ref(`rooms/${roomId}/gameState`).set({
                status: 'choosing_stance',
                mainPlayer: randomPlayer,
                item: randomItem,
                turnIndex: 0,
                votes: {}
            });
        });
    }

    function handleGameLogic(state) {
        const isMain = (myKey === state.mainPlayer);
        const actionArea = document.getElementById('actionArea');
        const instruction = document.getElementById('instructionText');
        const decisionButtons = document.getElementById('decisionButtons');
        const votingButtons = document.getElementById('votingButtons');
        
        actionArea.classList.remove('hidden');
        
        // Reset Card Effects
        document.querySelectorAll('.player-card').forEach(c => {
            c.classList.remove('active', 'blurred');
        });
        document.getElementById(`card-${state.mainPlayer}`).classList.add('active');

        if(state.status === 'choosing_stance') {
            if(isMain) {
                instruction.innerHTML = `YOU ARE MAIN! <br> Emoji: ${state.item.e} (${state.item.n})`;
                decisionButtons.classList.remove('hidden');
                votingButtons.classList.add('hidden');
            } else {
                instruction.innerText = "Waiting for Main Player to choose Truth or Lie...";
                decisionButtons.classList.add('hidden');
            }
        } 
        
        if(state.status === 'interrogation') {
            decisionButtons.classList.add('hidden');
            if(isMain) {
                document.getElementById(`card-${myKey}`).classList.add('blurred'); // Blur host card after selection
                instruction.innerText = "Interrogation started! Answer their questions.";
            } else {
                instruction.innerText = "Look at the main player! Decide: Truth or Lie?";
                votingButtons.classList.remove('hidden');
            }
        }

        if(state.status === 'finished') {
            instruction.innerText = state.result;
            votingButtons.classList.add('hidden');
            setTimeout(() => { if(amIHost) startGame(); }, 4000); // Auto restart turn
        }
    }

    function setStance(type) {
        db.ref(`rooms/${roomId}/gameState/status`).set('interrogation');
    }

    function castVote(val) {
        db.ref(`rooms/${roomId}/gameState/votes/${myKey}`).set(val);
        document.getElementById('votingButtons').classList.add('hidden');
        document.getElementById('instructionText').innerText = "Vote Cast! Waiting for others...";
        
        // Check if majority voted
        db.ref(`rooms/${roomId}`).once('value', snap => {
            const data = snap.val();
            const total = Object.keys(data.players).length;
            const currentVotes = Object.keys(data.gameState.votes || {}).length;
            if(currentVotes >= (total - 1) && total > 1) calculateWinner(data.gameState.votes);
        });
    }

    function calculateWinner(votes) {
        let lies = 0, truths = 0;
        for(let id in votes) { votes[id] === 'lie' ? lies++ : truths++; }
        const result = (lies > truths) ? "CREW MATE WON! (Caught the lie)" : "IMPOSTER WON! (Fooled you)";
        db.ref(`rooms/${roomId}/gameState/status`).set('finished');
        db.ref(`rooms/${roomId}/gameState/result`).set(result);
    }
</script>
</body>
</html>
